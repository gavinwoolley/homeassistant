      webhook_id: mimir_watchdog
      allowed_methods: [POST]
      local_only: false
  action:
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.monitoring_last_watchdog
      data:
        timestamp: "{{ now().timestamp() }}"

- id: monitoring_pipeline_silent
  alias: "Alerts: Monitoring pipeline silent"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.monitoring_watchdog
      to: "off"
      for: "00:02:00"
    - platform: state
      entity_id: binary_sensor.monitoring_watchdog
      to: "off"
      for: "00:32:00"
    - platform: state
      entity_id: binary_sensor.monitoring_watchdog
      to: "off"
      for: "01:02:00"
  condition:
    - condition: state
      entity_id: input_boolean.alerts_muted
      state: "off"
  action:
    - service: script.notify_whatsapp
      data:
        message: >-
          ⚠️ Monitoring pipeline not reporting — the Mimir watchdog has been
          silent for {{ relative_time(states.binary_sensor.monitoring_watchdog.last_changed) }}.
          Check Mimir / Alloy / nginx on the Docker host.
    - service: html5.send_message
      target:
        label_id: push_devices
      data:
        title: "⚠️ Monitoring pipeline silent"
        message: "Mimir watchdog heartbeat lost. Check Mimir / Alloy."
        tag: "monitoring_pipeline_silent"

- id: alerts_mute_auto_unmute
  alias: "Alerts: Start the auto-unmute timer"
  # A bare `delay:` here was lost on every HA restart (deploys), so a mute
  # set on 2026-09-07 stayed on for 3 days and silenced every WhatsApp alert.
  # timer.alerts_muted has restore:true, so the countdown survives restarts -
  # same pattern as heating_boost / adguard_protection_disabled.
  # restart mode => re-muting (or changing the duration) resets the timer.
  mode: restart
  trigger:
    - platform: state
      entity_id: input_boolean.alerts_muted
      to: "on"
  action:
    - service: timer.start
      target:
        entity_id: timer.alerts_muted
      data:
        duration: >-
          {% set d = states('input_select.alert_mute_duration') %}
          {{ {'15 minutes': '00:15:00', '1 hour': '01:00:00', '4 hours': '04:00:00', '24 hours': '24:00:00'}[d] | default('01:00:00') }}
    - service: persistent_notification.create
      data:
        title: "Alerts muted"
        message: >-
          WhatsApp/push alerts muted for {{ states('input_select.alert_mute_duration') }}.
          Rules still evaluate in Mimir; the Alertmanager still records them.
        notification_id: alerts_muted

- id: alerts_mute_timer_finished
  alias: "Alerts: Auto-unmute when the timer finishes"
  trigger:
    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.alerts_muted
  condition:
    - condition: state
      entity_id: input_boolean.alerts_muted
      state: "on"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.alerts_muted

- id: alerts_mute_tidy_up
  alias: "Alerts: Tidy up when unmuted"
  trigger:
    - platform: state
      entity_id: input_boolean.alerts_muted
      to: "off"
  action:
    - service: timer.cancel
      target:
        entity_id: timer.alerts_muted
    - service: persistent_notification.dismiss
      data:
        notification_id: alerts_muted
