- id: Kids Internet Block Timer Finished
  alias: Kids Internet Block Timer Finished
  trigger:
    platform: event
    event_type: timer.finished
    event_data:
      entity_id: timer.kids_internet_block
  condition:
    condition: state
    entity_id: input_boolean.kids_internet_blocked
    state: "on"
  action:
  - service: script.kids_internet_restore
- id: Front Door Doorbell Event
  alias: Front Door Doorbell Event
  # event entities (motion/chime) have no "on" duration - each firing just
  # changes state to a new timestamp. (Re)start the timer on every event so
  # repeated activity keeps extending the window; the timer-finished
  # automation below is what turns the boolean back off.
  # event.front_door_motion fires for camera_motion/camera_person/camera_sound
  # alike (Nest doesn't split these into separate entities) - only react to
  # actual person detections, not generic motion/sound, to cut down on
  # false pop-ups of the Home dashboard card.
  trigger:
  - platform: state
    entity_id: event.front_door_chime
    id: chime
  - platform: state
    entity_id: event.front_door_motion
    id: motion
  condition:
  - condition: or
    conditions:
    - condition: trigger
      id: chime
    - condition: and
      conditions:
      - condition: trigger
        id: motion
      - condition: template
        value_template: "{{ trigger.to_state.attributes.event_type == 'camera_person' }}"
  action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.front_door_recent_activity
  - service: timer.start
    target:
      entity_id: timer.front_door_recent_activity
- id: Front Door Recent Activity Timer Finished
  alias: Front Door Recent Activity Timer Finished
  trigger:
    platform: event
    event_type: timer.finished
    event_data:
      entity_id: timer.front_door_recent_activity
  action:
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.front_door_recent_activity
- id: Clear Stuck Countdown Cards On Startup
  alias: Clear Stuck Countdown Cards On Startup
  # Safety net for deploys: timers use restore:true, but if a timer somehow
  # comes back idle while its input_boolean is still on, the Home-screen
  # countdown card would be stuck. A minute after startup, reconcile them.
  trigger:
  - platform: homeassistant
    event: start
  action:
  - delay: "00:01:00"
  - if:
    - condition: state
      entity_id: input_boolean.heating_boost
      state: "on"
    - condition: state
      entity_id: timer.heating_boost
      state: idle
    then:
    - service: script.heating_boost_off
  - if:
    - condition: state
      entity_id: input_boolean.adguard_protection_disabled
      state: "on"
    - condition: state
      entity_id: timer.adguard_protection_disabled
      state: idle
    then:
    - service: script.enable_protection_now
  - if:
    - condition: state
      entity_id: input_boolean.kids_internet_blocked
      state: "on"
    - condition: state
      entity_id: timer.kids_internet_block
      state: idle
    then:
    - service: script.kids_internet_restore
  - if:
    - condition: state
      entity_id: input_boolean.alerts_muted
      state: "on"
    - condition: state
      entity_id: timer.alerts_muted
      state: idle
    then:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.alerts_muted
  - if:
    - condition: state
      entity_id: input_boolean.front_door_recent_activity
      state: "on"
    - condition: state
      entity_id: timer.front_door_recent_activity
      state: idle
    then:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.front_door_recent_activity
