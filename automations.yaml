          You are running {{ states('sensor.current_version_2') }}.
          Update HA_VERSION in docker-compose.yml and rebuild to upgrade.
        notification_id: ha_update_available

# --- Mimir alerting -----------------------------------------------------------

- id: mimir_alert_whatsapp
  alias: "Alerts: Mimir -> WhatsApp"
  mode: queued
  max: 30
  trigger:
    - platform: webhook
      webhook_id: mimir_alert_whatsapp
      allowed_methods: [POST]
      local_only: false
  condition:
    - condition: state
      entity_id: input_boolean.alerts_muted
      state: "off"
  action:
    - repeat:
        for_each: "{{ trigger.json.alerts | default([]) }}"
        sequence:
          - variables:
              a: "{{ repeat.item }}"
          - service: script.notify_whatsapp
            data:
              message: >-
                {%- set sev = a.labels.severity | default('none') -%}
                {%- set sev_emoji = {'critical': '🚨', 'warning': '⚠️', 'info': 'ℹ️'}.get(sev, '❓') -%}
                {%- set status_emoji = '✅' if a.status == 'resolved' else '🔥' -%}
                {%- set tag = '[RESOLVED]' if a.status == 'resolved' else '[FIRING]' -%}
                {%- set instance_meaningful = a.labels.job in ['windows', 'integrations/unix'] -%}
                {%- set head = status_emoji ~ ' ' ~ tag ~ ' ' ~ sev_emoji ~ ' ' ~ (sev | upper) ~ ' · ' ~ a.labels.alertname ~ (' · ' ~ a.labels.instance if instance_meaningful and a.labels.instance is defined else '') -%}
                {%- set parts = [head] -%}
                {%- if a.annotations.summary is defined -%}
                  {%- set parts = parts + ['Summary: ' ~ a.annotations.summary] -%}
                {%- endif -%}
                {%- if a.annotations.description is defined -%}
                  {%- set parts = parts + ['Description: ' ~ a.annotations.description] -%}
                {%- endif -%}
                {%- if a.status == 'resolved' -%}
                  {%- set start_ts = as_timestamp(a.startsAt) -%}
                  {%- set end_ts = as_timestamp(a.endsAt) -%}
                  {%- set dur_s = (end_ts - start_ts) | int(0) -%}
                  {%- set dur_h = dur_s // 3600 -%}
                  {%- set dur_m = (dur_s % 3600) // 60 -%}
                  {%- set duration = (dur_h ~ 'h ' ~ dur_m ~ 'm') if dur_h > 0 else ((dur_m ~ 'm') if dur_m > 0 else (dur_s ~ 's')) -%}
                  {%- set parts = parts + ['Started: ' ~ (start_ts | timestamp_custom('%d %b %H:%M', true))] -%}
                  {%- set parts = parts + ['Ended: ' ~ (end_ts | timestamp_custom('%d %b %H:%M', true))] -%}
                  {%- set parts = parts + ['Duration: ' ~ duration] -%}
                {%- else -%}
                  {%- if a.annotations.runbook_url is defined -%}
                    {%- set parts = parts + ['Runbook: ' ~ a.annotations.runbook_url] -%}
                  {%- endif -%}
                  {%- set nsm = namespace(matchers=[]) -%}
                  {%- for k, v in a.labels.items() -%}
                    {%- set nsm.matchers = nsm.matchers + ['matcher=' ~ k ~ '=' ~ (v | string | urlencode)] -%}
                  {%- endfor -%}
                  {%- set silence_url = 'https://home.example.com:599/grafana/alerting/silence/new?alertmanager=' ~ ('Mimir Alertmanager' | urlencode) ~ '&' ~ (nsm.matchers | join('&')) -%}
                  {%- set parts = parts + ['Silence: ' ~ silence_url] -%}
                {%- endif -%}
                {%- set parts = parts + ['Alerts: https://home.example.com:599/grafana/alerting/list?search=' ~ a.labels.alertname] -%}
                {{ parts | join('\n') }}
          # Also push criticals to phones so a CallMeBot outage isn't silent.
          - if:
              - condition: template
                value_template: "{{ a.status == 'firing' and a.labels.severity == 'critical' }}"
            then:
              - service: html5.send_message
                target:
                  label_id: push_devices
                data:
                  title: "🔴 {{ a.labels.alertname }}"
                  message: "{{ a.annotations.summary | default(a.labels.instance) | default('critical alert') }}"
                  tag: "mimir_{{ a.labels.alertname }}_{{ a.labels.instance | default('') }}"

- id: mimir_watchdog_heartbeat
  alias: "Alerts: Mimir watchdog heartbeat"
  mode: queued
  trigger:
