  condition:
    condition: or
    conditions:
    - condition: template
      value_template: "{% set start = today_at(states('input_datetime.motion_alert_evening_condition_time')) %} {% set end = today_at(states('input_datetime.motion_alert_morning_condition_time')) %} {{ now() >= start and now() <= end }}"
    - condition: template
      value_template: '{% if not is_state(''person.homer_simpson'', ''home'') and (now() - states.person.homer_simpson.last_changed).total_seconds() > 300
        and not is_state(''person.marge_simpson'', ''home'') and (now() - states.person.marge_simpson.last_changed).total_seconds() > 300 %}true{% endif %}'
  action:
  - service: camera.snapshot
