- id: irrigation_daily_schedule
  alias: "Irrigation: Daily Schedule"
  description: "Runs Zone 1, Zone 2, Zone 3 sequentially each morning"
  mode: single
  trigger:
    - platform: time
      at: input_datetime.irrigation_start_time
  condition:
    - condition: state
      entity_id: input_boolean.irrigation_enabled
      state: 'on'
    - condition: template
      value_template: >
        {% set day = now().weekday() %}
        {% set day_map = {
          0: 'input_boolean.irrigation_monday',
          1: 'input_boolean.irrigation_tuesday',
          2: 'input_boolean.irrigation_wednesday',
          3: 'input_boolean.irrigation_thursday',
          4: 'input_boolean.irrigation_friday',
          5: 'input_boolean.irrigation_saturday',
          6: 'input_boolean.irrigation_sunday'
        } %}
        {{ is_state(day_map[day], 'on') }}
  action:
    - service: weather.get_forecasts
      target:
        entity_id: weather.home_homer_simpson_com
      data:
        type: hourly
      response_variable: irrigation_rain_forecast
    - if:
        - condition: template
          value_template: >
            {% set threshold = states('input_number.irrigation_rain_threshold') | float(1.0) %}
            {% if is_state('input_boolean.irrigation_rain_sensor_enabled', 'off') %}
              false
            {% else %}
              {% set current = states('sensor.home_homer_simpson_com_rain_intensity') | float(0) %}
              {% set past_12h = states('sensor.rain_intensity_12h_max') | float(0) %}
              {% set fc = irrigation_rain_forecast['weather.home_homer_simpson_com']['forecast'] | default([]) %}
              {% set now_ts = as_timestamp(now()) %}
              {% set cutoff_ts = now_ts + (12 * 3600) %}
              {% set ns = namespace(next_12h = 0) %}
              {% for f in fc %}
                {% set f_ts = as_timestamp(f.datetime) %}
                {% if f_ts >= now_ts and f_ts <= cutoff_ts %}
                  {% set ns.next_12h = [ns.next_12h, f.precipitation | float(0)] | max %}
                {% endif %}
              {% endfor %}
              {{ current >= threshold or past_12h >= threshold or ns.next_12h >= threshold }}
            {% endif %}
      then:
        - stop: "Skipped: rain detected in the past 12h, current reading, or next 12h forecast"
    # Zone 1
    - service: valve.open_valve
      target:
        entity_id: valve.wt_11w_zone_1
    - delay:
        minutes: "{{ states('input_number.irrigation_zone1_duration') | int }}"
    - service: valve.close_valve
      target:
        entity_id: valve.wt_11w_zone_1
    - delay:
        seconds: 30
    # Zone 2
    - service: valve.open_valve
      target:
        entity_id: valve.wt_11w_zone_2
    - delay:
        minutes: "{{ states('input_number.irrigation_zone2_duration') | int }}"
    - service: valve.close_valve
      target:
        entity_id: valve.wt_11w_zone_2
    - delay:
        seconds: 30
    # Zone 3
    - service: valve.open_valve
      target:
        entity_id: valve.wt_11w_zone_3
    - delay:
        minutes: "{{ states('input_number.irrigation_zone3_duration') | int }}"
    - service: valve.close_valve
      target:
        entity_id: valve.wt_11w_zone_3

- id: ha_update_available_notification
  alias: "Notify: Home Assistant Update Available"
  trigger:
    - platform: homeassistant
      event: start
    - platform: state
