      value_template: >
        {{ states('sensor.ha_latest_version') not in ['unknown', 'unavailable', ''] and
           states('sensor.current_version_2') not in ['unknown', 'unavailable', ''] and
           states('sensor.ha_latest_version') != states('sensor.current_version_2') }}
