- id: Driveway on
  alias: Driveway on
  trigger:
  - platform: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: 0
  - platform: homeassistant
    event: start
  condition:
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: 0
  - condition: time
    before: '00:00:00'
    after: '12:00:00'
  action:
  - service: switch.turn_on
    data:
      entity_id:
      - switch.door_number_light_socket
      - switch.front_lights_switch_1
- id: Driveway off
  alias: Driveway off
  trigger:
  - platform: time
    at: '00:15:00'
  # The automation trace showed the real cause: switch.turn_off errors with
  # "network error:(-9999999) Remote api run unknown failed" - a Tuya cloud
  # SDK failure, not a logic bug (manual/voice control never fails - those
  # are single isolated calls). Driveway off and Patio off both used to
  # trigger at the same 00:00:00 instant, bursting up to 4 simultaneous Tuya
  # calls within ~1s of each other. Spread this automation's two calls out
  # (5s apart) and see "Patio off" for the other half of the desync.
  action:
  - service: switch.turn_off
    data:
      entity_id: switch.door_number_light_socket
  - delay: '00:00:05'
  - service: switch.turn_off
    data:
      entity_id: switch.front_lights_switch_1
- id: Patio on
  alias: Patio on
  trigger:
  - platform: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: 0
  - platform: homeassistant
    event: start
  condition:
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: 0
  - condition: time
    before: '00:00:00'
    after: '12:00:00'
  action:
  - service: switch.turn_on
    data:
      entity_id:
      - switch.patio_switch_1
      - switch.patio_lights_socket_1
- id: Patio off
  alias: Patio off
  trigger:
  - platform: time
    at: '00:25:00'
  # See "Driveway off" - separate service call per switch. Now 10 minutes
  # after Driveway off (00:15:00), so the two automations' Tuya calls no
  # longer risk bursting together.
  action:
  - service: switch.turn_off
    data:
      entity_id: switch.patio_switch_1
  - delay: '00:00:05'
  - service: switch.turn_off
    data:
      entity_id: switch.patio_lights_socket_1
- id: Kitchen WLED on
