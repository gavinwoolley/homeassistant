- id: marge_simpson_heading_home_html5
  alias: "Notify: Marge Simpson Heading Home (HTML5)"
  mode: single
  trigger:
    - platform: state
      entity_id: sensor.marge_simpson_home_marge_simpson_direction_of_travel
      to: "towards"
      for: "00:05:00"
  condition:
    - condition: not
      conditions:
        - condition: state
          entity_id: person.marge_simpson
          state: "home"
    - condition: template
      value_template: "{{ states('sensor.marge_simpson_home_marge_simpson_distance') | float(99999) < 10000 }}"
  action:
    - action: html5.send_message
      target:
        label_id: push_devices
      data:
        title: "Marge Simpson Heading Home"
        message: "Marge Simpson is on the way home."
        tag: "marge_simpson_heading_home"

