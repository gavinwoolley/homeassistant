map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
	listen 9091 ssl;
	server_name home.example.com;

	ssl_certificate /Certificate/certificate.pem;
	ssl_certificate_key /Certificate/privateKey.key;

	# Strip headers that prevent iframe embedding (required for HA sidebar panel)
	proxy_hide_header X-Frame-Options;
	proxy_hide_header Content-Security-Policy;

	# WebSocket support
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;

	# Buffers - UniFi uses large cookies/responses
	proxy_buffer_size        128k;
	proxy_buffers            4 256k;
	proxy_busy_buffers_size  256k;

	location = / {
		return 301 https://home.example.com:9091/manage;
	}

	location / {
		proxy_pass          https://10.0.0.10:8443;
		proxy_ssl_verify    off;

		proxy_set_header    Host              10.0.0.10:8443;
		proxy_set_header    X-Real-IP         $remote_addr;
		proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header    X-Forwarded-Proto $scheme;

		# Rewrite Origin and Referer to match UniFi's own address
		# UniFi 7+/8+ CSRF protection rejects requests where Origin != server host
		proxy_set_header    Origin            https://10.0.0.10:8443;
		proxy_set_header    Referer           https://10.0.0.10:8443;

		proxy_read_timeout  90;
		proxy_send_timeout  90;
	}
}
