upstream demo_ha_backend {
    server 10.0.0.10:8124;
}

# Reverse proxy to the demo Home Assistant instance
# (demo/docker-compose.demo.yml) - for local testing/embedding in the real
# HA sidebar only, not a public hostname. Uses the same shared cert as
# everything else under home.example.com; no separate DNS/cert needed.
# Same pattern as every other site here (adguard.conf, grafana.conf, ...) -
# a plain host:port upstream, not a shared Docker network.
server {
  listen 9458 ssl;
  server_name home.example.com;
  ssl_certificate /Certificate/certificate.pem;
  ssl_certificate_key /Certificate/privateKey.key;

  location / {
      proxy_http_version 1.1;
      proxy_pass http://demo_ha_backend/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # websockets (HA's frontend connection)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Allow framing in the real HA sidebar
      proxy_hide_header X-Frame-Options;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Content-Security-Policy "frame-ancestors 'self' https://home.example.com:8123 https://home.example.com:8124" always;

      proxy_redirect off;
  }
}
