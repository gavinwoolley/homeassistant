# Internal-only nginx stub_status endpoint for nginx-exporter (docker-compose).
# Not published to any host port - only reachable on the compose bridge network
# as http://nginx:8081/stub_status.
server {
	listen 8081;
	server_name _;

	access_log off;

	location = /stub_status {
		stub_status;
		allow 127.0.0.1;
		# The compose project's default bridge network isn't pinned to a
		# subnet (no top-level networks: block in docker-compose.yml), so
		# Docker's auto-assigned pool has drifted over time as more networks
		# were created on this host - it's currently 10.0.0.87/20, not
		# 172.16.0.0/12 like when this file was first written (confirmed via
		# `docker network inspect s_default`). That drift silently broke this
		# allowlist and fired the NginxDown alert (nginx-exporter's stub_status
		# scrape 403ing), even though nginx itself was never actually down.
		# Both ranges allowed so this survives the pool drifting again.
		allow 172.16.0.0/12;   # docker compose bridge networks (legacy default range)
		allow 192.168.0.0/16;  # docker compose bridge networks (current auto-assigned range)
		deny all;
	}

	location / {
		return 404;
	}
}
