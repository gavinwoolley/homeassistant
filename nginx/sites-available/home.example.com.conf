server {
	listen 4438 ssl;
	listen [::]:4438 ssl;

	server_name home.example.com;
	root /var/www/home.example.com/public;

	# SSL
	ssl_certificate /Certificate/certificate.pem;
	ssl_certificate_key /Certificate/privateKey.key;

	# reverse proxy
	location /blueiris/ {
		rewrite ^/blueiris/(.*) /$1  break;
		proxy_ignore_client_abort on;
		proxy_pass http://10.0.0.250:81/;
		proxy_redirect http://10.0.0.250:81 /blueiris;
        proxy_read_timeout 90; 
		include proxy.conf;
	}

   # location / {
	#	rewrite /(.*) /$1 break;
	#    proxy_pass https://home.example.com:8123;
	#    include proxy.conf;
	#}

	include general.conf;
}



