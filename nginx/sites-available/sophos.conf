
server {
        listen 7563 ssl;
        server_name home.example.com;
#        underscores_in_headers on;
#
#	send_timeout 100m; #Some players don't reopen a socket and playback stops totally instead of resuming after an extended pause (e.g. Chrome)
#
#	# SSL
	ssl_certificate /Certificate/certificate.pem;
	ssl_certificate_key /Certificate/privateKey.key;
	#Buffering off send to the client as soon as the data is received from Plex.
	proxy_redirect off;
	proxy_buffering off;

    location / {
        # Proxy all requests to the UTM
        proxy_pass https://10.0.0.236:4444/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

}