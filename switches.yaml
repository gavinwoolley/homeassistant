# External IP sensor (moved from deprecated sensor platform: command_line)
- sensor:
    name: "Current IP"
    unique_id: current_ip
    command: "curl -s http://checkip.amazonaws.com"
    scan_interval: 180

# Renovate open PRs - written by azure-pipelines-renovate.yml each run
- sensor:
    name: "Renovate Open PRs"
    unique_id: renovate_open_prs
    command: "cat /config/renovate_prs.json 2>/dev/null || echo '{\"count\":0,\"prs\":[]}'"
    value_template: "{{ value_json.count }}"
    json_attributes_path: "$"
    json_attributes:
      - prs
    scan_interval: 300

# Camera PTZ Switches - Bart Simpson Room Camera
- switch:
    name: "Bart Simpson Room Camera Left"
    unique_id: bart_simpson_room_camera_left
    command_on: 'curl -k "http://10.0.0.250:81/cam/Lisa SimpsonBackRoom/pos=0"'
    command_off: 'true'
- switch:
    name: "Bart Simpson Room Camera Right"
    unique_id: bart_simpson_room_camera_right
    command_on: 'curl -k "http://10.0.0.250:81/cam/Lisa SimpsonBackRoom/pos=1"'
    command_off: 'true'
- switch:
    name: "Bart Simpson Room Camera Up"
    unique_id: bart_simpson_room_camera_up
    command_on: 'curl -k "http://10.0.0.250:81/cam/Lisa SimpsonBackRoom/pos=2"'
    command_off: 'true'
- switch:
