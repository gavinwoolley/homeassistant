# AdGuard Home config, deployed by azure-pipelines-docker.yml when anything
# under adguard/ changes (docker stop adguard -> cp -> docker start).
#
# CAVEAT: AdGuard rewrites this file itself at runtime - every filter refresh,
# client auto-discovery, "disable protection for 10 min", schema upgrade, etc.
# So the live file WILL drift from this one. Git is the source of *intent*:
# the meaningful bits (filters:, user_rules:, upstream_dns:, dns: settings,
# clients.persistent:) are stable and only change when you change them. The
# noise (schema_version, protection_disabled_until, os:, log:, filter
# metadata) is cosmetic.
#
# To make a change: edit here, commit, let the pipeline deploy it - it
# overwrites the live file, so anything you changed only in the AdGuard UI
# since the last pull is lost. To pull the live config back into git:
#   ssh ha "docker exec adguard cat /opt/adguardhome/conf/AdGuardHome.yaml" \
#     | sed 's|password: REDACTED "#{adguard_password_hash}#"|' \
#     > adguard/AdGuardHome.yaml
#
# The admin password hash is tokenised - set the DevOps pipeline variable
# adguard_password_hash to the bcrypt hash from `users:` in the live file.
http:
  pprof:
    port: 6060
    enabled: false
  doh:
    routes:
      - GET /dns-query
      - POST /dns-query
      - GET /dns-query/{ClientID}
      - POST /dns-query/{ClientID}
    insecure_enabled: false
  address: 0.0.0.0:3000
  session_ttl: 30d
