    - name: google
      state: '{{ states.binary_sensor.google_dns.attributes.round_trip_time_avg }}'
      availability: '{{ is_state("binary_sensor.google_dns", "on") and "round_trip_time_avg" in states.binary_sensor.google_dns.attributes }}'
      unit_of_measurement: ms

    - name: garden_upper_camera
      state: '{{ states.binary_sensor.garden_upper.attributes.round_trip_time_avg }}'
      availability: '{{ is_state("binary_sensor.garden_upper", "on") and "round_trip_time_avg" in states.binary_sensor.garden_upper.attributes }}'
      unit_of_measurement: ms

    - name: front_camera
      state: '{{ states.binary_sensor.front.attributes.round_trip_time_avg }}'
      availability: '{{ is_state("binary_sensor.front", "on") and "round_trip_time_avg" in states.binary_sensor.front.attributes }}'
      unit_of_measurement: ms

