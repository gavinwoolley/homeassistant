homeassistant:
  # Name of the location where Home Assistant is running.
  name: home.example.com
  # Location required to calculate the time the sun rises and sets
  latitude: 39.7588
  longitude: -89.6213
  # Impacts weather/sunrise data (altitude above sea level in meters)
  elevation: 180
  # metric for Metric, imperial for Imperial
  unit_system: metric
  # Pick yours from here: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  time_zone: Europe/London
  customize: !include customize.yaml
  external_url: https://home.example.com:8123
  internal_url: https://home.example.com:8123
  allowlist_external_dirs:
    - /config
    - /config/www/alerts
  auth_providers:
    - type: homeassistant
    - type: trusted_networks
      trusted_networks:
        - 10.0.0.0/24
  auth_mfa_modules:
    - type: totp
      name: Authenticator app
    - type: notify
      message: "OTP Code for HA Dashboard {}"

# sensor:
#   - platform: authenticated
#     enable_notification: true

prometheus:
  requires_auth: false
  filter:
    include_domains:
      - sensor
      - alarm_control_panel
      - automation
      - binary_sensor
      - climate
      - cover
      - counter
      - device_tracker
      - fan
      - humidifier
      - input_boolean
      - input_number
      - light
      - lock
      - number
      - person
      - sensor
      - switch
      - update
      - valve

file:

wake_on_lan:

default_config:

stream:

my:

system_health:

media_source:

script: !include scripts.yaml
automation: !include automations.yaml
command_line: !include switches.yaml

light:
  - platform: group
    name: Kitchen Plinths
    entities:
      - light.kitchen_island_plinth
      - light.kitchen_tall_units_plinth
      - light.kitchen_under_stair_units_plinth
      - light.kitchen_sink_plinth

frontend:
  themes: !include_dir_merge_named themes

# dashboard-overview switched from storage-mode (edited via the UI, only
# living in .storage/lovelace.dashboard_overview) to yaml-mode, reading
# straight from ui-lovelace.yaml in this repo - so a git-committed change
# is genuinely live after a deploy + restart, no more manual copy/paste
# into the UI's raw config editor. Same url_path, so every existing link
# (WhatsApp, Alertmanager annotations, cast entries, the home banner) is
# unaffected. TEST: if HA logs a url_path conflict with the pre-existing
# storage dashboard on restart, that dashboard needs deleting via
# Settings -> Dashboards first - see BackupConfig/lovelace-migration-*/
# for the pre-migration storage-mode backup.
lovelace:
  dashboards:
    dashboard-overview:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Overview
      icon: mdi:home-account
      show_in_sidebar: true

# Enables configuration UI
config:

mobile_app:

conversation:

template:
  - switch:
      # Heating Boost
      - name: "Heating Boost"
        unique_id: heating_boost
        icon: mdi:fire
        state: "{{ is_state('input_boolean.heating_boost', 'on') }}"
        turn_on:
          - service: script.heating_boost_on
        turn_off:
          - service: script.heating_boost_off

      # Kids Internet Block - blocks a set of kids' devices at the UniFi
      # controller for the window picked in input_select.kids_block_duration.
      - name: "Kids Internet Block"
        unique_id: kids_internet_block
        icon: mdi:wifi-cancel
        state: "{{ is_state('input_boolean.kids_internet_blocked', 'on') }}"
        turn_on:
          - service: script.kids_internet_block
        turn_off:
          - service: script.kids_internet_restore

      # Homer Simpson Laptop Wake (mirrors the real plug's state; on turns the
      # plug on and sends a WOL packet 10s later)
      - name: "Homer Simpson Laptop Wake"
        unique_id: homer_simpson_laptop_wake
        icon: mdi:laptop
        state: "{{ is_state('switch.smart_plug_6_socket_1', 'on') }}"
        turn_on:
          - service: script.homer_simpson_laptop_wake_full
        turn_off:
          - service: switch.turn_off
            target:
              entity_id: switch.smart_plug_6_socket_1

      # Homer Simpson Laptop WOL-only (for waking from hibernate/sleep, where the
      # plug is already on - scripts don't expose a stable on/off state
      # for Google, so this pulses a helper boolean as its backing state)
      - name: "Homer Simpson Laptop WOL"
        unique_id: homer_simpson_laptop_wol
        icon: mdi:lan-connect
        state: "{{ is_state('input_boolean.homer_simpson_laptop_wol_pulse', 'on') }}"
        turn_on:
          - service: script.homer_simpson_laptop_wol_only
        turn_off:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.homer_simpson_laptop_wol_pulse

      # Kitchen Plinth Presets (for Google Assistant - scripts don't expose
      # a stable on/off state, so these wrap them in a real toggle)
      - name: "Plinth Warm"
        unique_id: plinth_warm
        icon: mdi:thermometer-low
        state: "{{ states('input_select.plinth_active_mode') == 'Warm' }}"
        turn_on:
          - service: script.plinth_warm_white
        turn_off:
          - service: script.plinth_off
      - name: "Plinth Cool"
        unique_id: plinth_cool
        icon: mdi:thermometer-high
        state: "{{ states('input_select.plinth_active_mode') == 'Cool' }}"
        turn_on:
          - service: script.plinth_cool_white
        turn_off:
          - service: script.plinth_off
      - name: "Plinth Audio"
        unique_id: plinth_audio
        icon: mdi:music-note
        state: "{{ states('input_select.plinth_active_mode') == 'Audio' }}"
        turn_on:
          - service: script.plinth_audio_reactive
        turn_off:
          - service: script.plinth_off

      # Kitchen Wall Units Presets (for Google Assistant, same reasoning)
      - name: "Wall Units Warm"
        unique_id: wall_units_warm
        icon: mdi:thermometer-low
        state: "{{ states('input_select.wall_units_active_mode') == 'Warm' }}"
        turn_on:
          - service: script.wall_units_warm_white
        turn_off:
          - service: script.wall_units_off
      - name: "Wall Units Cool"
        unique_id: wall_units_cool
        icon: mdi:thermometer-high
        state: "{{ states('input_select.wall_units_active_mode') == 'Cool' }}"
        turn_on:
          - service: script.wall_units_cool_white
        turn_off:
          - service: script.wall_units_off

      # Bart Simpson Motion Kitchen Display
      - name: "Bart Simpson Motion Kitchen Display"
        unique_id: bart_simpson_motion_kitchen_display
        state: "{{ is_state('automation.bart_simpson_room_motion_camera_image_on_kitchen_display', 'on') }}"
        turn_on:
          - service: automation.turn_on
            target:
              entity_id: automation.bart_simpson_room_motion_camera_image_on_kitchen_display
        turn_off:
          - service: automation.turn_off
            target:
              entity_id: automation.bart_simpson_room_motion_camera_image_on_kitchen_display

      # Bart Simpson Motion Bedroom Display
      - name: "Bart Simpson Motion Bedroom Display"
        unique_id: bart_simpson_motion_bedroom_display
        state: "{{ is_state('automation.bart_simpson_room_motion_camera_image_on_bedroom_display', 'on') }}"
        turn_on:
          - service: automation.turn_on
            target:
              entity_id: automation.bart_simpson_room_motion_camera_image_on_bedroom_display
        turn_off:
          - service: automation.turn_off
            target:
              entity_id: automation.bart_simpson_room_motion_camera_image_on_bedroom_display
      # All Motion Automations
      - name: "All Motion Automations"
        unique_id: all_motion_automations
        # image_processing conditions removed from state check (re-enable by adding back as 'and' lines):
        # and is_state("automation.front_motion_image_processing", "on")
        # and is_state("automation.garden_shed_upper_motion_image_processing", "on")
        # and is_state("automation.garden_shed_lower_motion_image_processing", "on")
        # and is_state("automation.patio_outdoor_motion_image_processing", "on")
        # and is_state("automation.garden_upper_motion_image_processing", "on")
        state: >-
          {% if is_state("automation.dogs_motion", "on")
            and is_state("automation.front_motion", "on")
            and is_state("automation.garden_shed_upper_motion", "on")
            and is_state("automation.garden_shed_lower_motion", "on")
            and is_state("automation.bart_simpson_room_motion", "on")
            and is_state("automation.patio_outdoor_motion", "on")
            and is_state("automation.garden_upper_motion", "on") %}
            on
          {% else %}
            off
          {% endif %}
        turn_on:
          - service: automation.turn_on
            target:
              entity_id:
                - automation.dogs_motion
                - automation.front_motion
                # - automation.front_motion_image_processing
                - automation.garden_shed_upper_motion
                # - automation.garden_shed_upper_motion_image_processing
                - automation.garden_shed_lower_motion
                # - automation.garden_shed_lower_motion_image_processing
                - automation.bart_simpson_room_motion
                - automation.patio_outdoor_motion
                # - automation.patio_outdoor_motion_image_processing
                - automation.garden_upper_motion
                # - automation.garden_upper_motion_image_processing
        turn_off:
          - service: automation.turn_off
            target:
              entity_id:
                - automation.dogs_motion
                - automation.front_motion
                # - automation.front_motion_image_processing
                - automation.garden_shed_upper_motion
                # - automation.garden_shed_upper_motion_image_processing
                - automation.garden_shed_lower_motion
                # - automation.garden_shed_lower_motion_image_processing
                - automation.bart_simpson_room_motion
                - automation.patio_outdoor_motion
                # - automation.patio_outdoor_motion_image_processing
                - automation.garden_upper_motion
                # - automation.garden_upper_motion_image_processing

      # External Motion Automations
      - name: "External Motion Automations"
        unique_id: external_motion_automations
        # image_processing conditions removed from state check (re-enable by adding back as 'and' lines):
        # and is_state("automation.front_motion_image_processing", "on")
        # and is_state("automation.garden_shed_upper_motion_image_processing", "on")
        # and is_state("automation.garden_shed_lower_motion_image_processing", "on")
        # and is_state("automation.patio_outdoor_motion_image_processing", "on")
        # and is_state("automation.garden_upper_motion_image_processing", "on")
        state: >-
          {% if is_state("automation.front_motion", "on")
            and is_state("automation.garden_shed_upper_motion", "on")
            and is_state("automation.garden_shed_lower_motion", "on")
            and is_state("automation.patio_outdoor_motion", "on")
            and is_state("automation.garden_upper_motion", "on") %}
            on
          {% else %}
            off
          {% endif %}
        turn_on:
          - service: automation.turn_on
            target:
              entity_id:
                - automation.front_motion
                # - automation.front_motion_image_processing
                - automation.garden_shed_upper_motion
                # - automation.garden_shed_upper_motion_image_processing
                - automation.garden_shed_lower_motion
                # - automation.garden_shed_lower_motion_image_processing
                - automation.patio_outdoor_motion
                # - automation.patio_outdoor_motion_image_processing
                - automation.garden_upper_motion
                # - automation.garden_upper_motion_image_processing
        turn_off:
          - service: automation.turn_off
            target:
              entity_id:
                - automation.front_motion
                # - automation.front_motion_image_processing
                - automation.garden_shed_upper_motion
                # - automation.garden_shed_upper_motion_image_processing
                - automation.garden_shed_lower_motion
                # - automation.garden_shed_lower_motion_image_processing
                - automation.patio_outdoor_motion
                # - automation.patio_outdoor_motion_image_processing
                - automation.garden_upper_motion
                # - automation.garden_upper_motion_image_processing

      # Internal Motion Automations
      - name: "Internal Motion Automations"
        unique_id: internal_motion_automations
        state: >-
          {% if is_state("automation.dogs_motion", "on")
            and is_state("automation.bart_simpson_room_motion", "on") %}
            on
          {% else %}
            off
          {% endif %}
        turn_on:
          - service: automation.turn_on
            target:
              entity_id:
                - automation.dogs_motion
                - automation.bart_simpson_room_motion
        turn_off:
          - service: automation.turn_off
            target:
              entity_id:
                - automation.dogs_motion
                - automation.bart_simpson_room_motion

      # Motion Detected Lights On
      - name: "Motion Automation Lights"
        unique_id: motion_automation_lights
        state: >-
          {% if is_state("automation.garden_shed_upper_motion_lamp_on", "on")
            and is_state("automation.garden_upper_motion_lamp_on", "on")
            and is_state("automation.front_motion_lamp_on", "on")
            and is_state("automation.patio_outdoor_motion_lamp_on", "on")
            and is_state("automation.garden_shed_lower_motion_lamp_on", "on") %}
            on
          {% else %}
            off
          {% endif %}
        turn_on:
          - service: automation.turn_on
            target:
              entity_id:
                - automation.garden_shed_upper_motion_lamp_on
                - automation.garden_upper_motion_lamp_on
                - automation.front_motion_lamp_on
                - automation.patio_outdoor_motion_lamp_on
                - automation.garden_shed_lower_motion_lamp_on
        turn_off:
          - service: automation.turn_off
            target:
              entity_id:
                - automation.garden_shed_upper_motion_lamp_on
                - automation.garden_upper_motion_lamp_on
                - automation.front_motion_lamp_on
                - automation.patio_outdoor_motion_lamp_on
                - automation.garden_shed_lower_motion_lamp_on

      # Bedroom Display Motion Automations
      - name: "Bedroom Display Motion Automations"
        unique_id: bedroom_display_motion_automations
        state: >-
          {% if is_state("automation.garden_shed_upper_motion_camera_image_on_bedroom_display", "on")
            and is_state("automation.garden_upper_motion_camera_image_on_bedroom_display", "on")
            and is_state("automation.front_motion_camera_image_on_bedroom_display", "on")
            and is_state("automation.patio_outdoor_motion_camera_image_on_bedroom_display", "on")
            and is_state("automation.garden_shed_lower_motion_camera_image_on_bedroom_display", "on")
            and is_state("automation.dogs_motion_camera_image_on_bedroom_display", "on") %}
            on
          {% else %}
            off
          {% endif %}
        turn_on:
          - service: automation.turn_on
            target:
              entity_id:
                - automation.garden_shed_upper_motion_camera_image_on_bedroom_display
                - automation.garden_upper_motion_camera_image_on_bedroom_display
                - automation.front_motion_camera_image_on_bedroom_display
                - automation.patio_outdoor_motion_camera_image_on_bedroom_display
                - automation.garden_shed_lower_motion_camera_image_on_bedroom_display
                - automation.bart_simpson_room_motion_camera_image_on_bedroom_display
                - automation.dogs_motion_camera_image_on_bedroom_display
        turn_off:
          - service: automation.turn_off
            target:
              entity_id:
                - automation.garden_shed_upper_motion_camera_image_on_bedroom_display
                - automation.garden_upper_motion_camera_image_on_bedroom_display
                - automation.front_motion_camera_image_on_bedroom_display
                - automation.patio_outdoor_motion_camera_image_on_bedroom_display
                - automation.garden_shed_lower_motion_camera_image_on_bedroom_display
                - automation.bart_simpson_room_motion_camera_image_on_bedroom_display
                - automation.dogs_motion_camera_image_on_bedroom_display

      # Kitchen Display Motion Automations
      - name: "Kitchen Display Motion Automations"
        unique_id: kitchen_display_motion_automations
        state: >-
          {% if is_state("automation.garden_shed_upper_motion_camera_image_on_kitchen_display", "on")
            and is_state("automation.garden_upper_motion_camera_image_on_kitchen_display", "on")
            and is_state("automation.front_motion_camera_image_on_kitchen_display", "on")
            and is_state("automation.patio_outdoor_motion_camera_image_on_kitchen_display", "on")
            and is_state("automation.garden_shed_lower_motion_camera_image_on_kitchen_display", "on") %}
            on
          {% else %}
            off
          {% endif %}
        turn_on:
          - service: automation.turn_on
            target:
              entity_id:
                - automation.garden_shed_upper_motion_camera_image_on_kitchen_display
                - automation.garden_upper_motion_camera_image_on_kitchen_display
                - automation.front_motion_camera_image_on_kitchen_display
                - automation.patio_outdoor_motion_camera_image_on_kitchen_display
                - automation.garden_shed_lower_motion_camera_image_on_kitchen_display
                - automation.bart_simpson_room_motion_camera_image_on_kitchen_display
        turn_off:
          - service: automation.turn_off
            target:
              entity_id:
                - automation.garden_shed_upper_motion_camera_image_on_kitchen_display
                - automation.garden_upper_motion_camera_image_on_kitchen_display
                - automation.front_motion_camera_image_on_kitchen_display
                - automation.patio_outdoor_motion_camera_image_on_kitchen_display
                - automation.garden_shed_lower_motion_camera_image_on_kitchen_display
                - automation.bart_simpson_room_motion_camera_image_on_kitchen_display

      # Motion Detected Garden Lights and Sound
      - name: "Garden Lights and Sound"
        unique_id: garden_lights_and_sound
        state: >-
          {% if is_state("automation.garden_shed_upper_motion_lights_and_sound", "on")
            and is_state("automation.garden_upper_motion_lights_and_sound", "on")
            and is_state("automation.garden_shed_lower_motion_lights_and_sound", "on") %}
            on
          {% else %}
            off
          {% endif %}
        turn_on:
          - service: automation.turn_on
            target:
              entity_id:
                - automation.garden_shed_upper_motion_lights_and_sound
                - automation.garden_upper_motion_lights_and_sound
                - automation.garden_shed_lower_motion_lights_and_sound
        turn_off:
          - service: automation.turn_off
            target:
              entity_id:
                - automation.garden_shed_upper_motion_lights_and_sound
                - automation.garden_upper_motion_lights_and_sound
                - automation.garden_shed_lower_motion_lights_and_sound

  - sensor:
    - name: custom_date
      state: >-
        {% set day = ['Mon','Tue','Wed','Thur','Fri','Sat','Sun'][now().weekday()] %}
        {{ day + ' ' + now().strftime('%d %b, %Y')}}

    - name: heating_time_am_on
      state: >-
        {{ "%0.02d:%0.02d" | format(states("input_number.heating_hour_am_on") | int, states("input_number.heating_minute_am_on") | int) }}

    - name: heating_time_am_off
      state: >-
        {{ "%0.02d:%0.02d" | format(states("input_number.heating_hour_am_off") | int, states("input_number.heating_minute_am_off") | int) }}

    - name: heating_time_pm_on
      state: >-
        {{ "%0.02d:%0.02d" | format(states("input_number.heating_hour_pm_on") | int, states("input_number.heating_minute_pm_on") | int) }}

    - name: heating_time_pm_off
      state: >-
        {{ "%0.02d:%0.02d" | format(states("input_number.heating_hour_pm_off") | int, states("input_number.heating_minute_pm_off") | int) }}

    - name: blueiris
      state: '{{ states.binary_sensor.blueiris.attributes.round_trip_time_avg }}'
      availability: '{{ is_state("binary_sensor.blueiris", "on") and "round_trip_time_avg" in states.binary_sensor.blueiris.attributes }}'
