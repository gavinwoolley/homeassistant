recorder:
  purge_keep_days: 10
  exclude:
    entities:
      # Fast-changing host/network diagnostics that nothing graphs from the
      # recorder (Grafana reads these from Mimir, not here). ~18% of the states
      # table. CPU %, Mem %, disk, last boot and the ping *_average sensors stay.
      - sensor.network_in_eth0
      - sensor.network_out_eth0
      - sensor.memory_free
      - sensor.load_1m
      - sensor.load_5m
      - sensor.load_15m
      - sensor.icotera_router_download_speed
      - sensor.icotera_router_upload_speed
      - sensor.swap_use_percent

