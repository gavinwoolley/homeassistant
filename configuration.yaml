          {% set base = ["Solid","Blink","Breathe","Wipe","Wipe Random","Random Colors","Sweep","Dynamic","Colorloop","Rainbow","Scan","Scan Dual","Fade","Theater","Theater Rainbow","Running","Saw","Twinkle","Dissolve","Dissolve Rnd","Sparkle","Sparkle Dark","Sparkle+","Strobe","Strobe Rainbow","Strobe Mega","Blink Rainbow","Android","Chase","Chase Random","Chase Rainbow","Chase Flash","Chase Flash Rnd","Rainbow Runner","Colorful","Traffic Light","Sweep Random","Chase 2","Aurora","Stream","Scanner","Lighthouse","Rain","Tetrix","Fire Flicker","Gradient","Loading","Rolling Balls","Fairy","Two Dots","Fairytwinkle","Running Dual","Chase 3","Tri Wipe","Tri Fade","Lightning","ICU","Multi Comet","Scanner Dual","Stream 2","Oscillate","Pride 2015","Juggle","Palette","Fire 2012","Colorwaves","Bpm","Fill Noise","Noise 1","Noise 2","Noise 3","Noise 4","Colortwinkles","Lake","Meteor","Meteor Smooth","Railway","Ripple","Twinklefox","Twinklecat","Halloween Eyes","Solid Pattern","Solid Pattern Tri","Spots","Spots Fade","Glitter","Candle","Fireworks Starburst","Fireworks 1D","Bouncing Balls","Sinelon","Sinelon Dual","Sinelon Rainbow","Popcorn","Drip","Plasma","Percent","Ripple Rainbow","Heartbeat","Pacifica","Candle Multi","Solid Glitter","Sunrise","Phased","Twinkleup","Noise Pal","Sine","Phased Noise","Flow","Chunchun","Dancing Shadows","Washing Machine","Rotozoomer","Blends","TV Simulator","Dynamic Smooth","Perlin Move","Firenoise","Plasma Ball","Flow Stripe","Wavesins"] %}
          {% set cur = state_attr('light.utility_units', 'effect') %}
          {{ (base + [cur]) | unique | list if cur is not none and cur not in base else base }}
        state: "{{ state_attr('light.utility_units', 'effect') }}"
        select_option:
          - service: light.turn_on
            target:
              entity_id: light.utility_units
            data:
              effect: "{{ option }}"

rest_command:
  adguard_set_protection:
    url: "http://10.0.0.10:3008/control/protection"
    method: post
    headers:
      Authorization: !secret adguard_auth_header
      Content-Type: application/json
    payload: "{{ {'enabled': enabled, 'duration': duration_ms} | tojson }}"
  wled_set_cct:
    url: "http://{{ ip }}/json/state"
    method: post
    headers:
      Content-Type: application/json
    payload: "{{ {'seg': [{'id': 0, 'cct': cct}]} | tojson }}"

  # WhatsApp via CallMeBot (free personal API). phone/apikey are passed in by
  # script.notify_whatsapp so the secrets stay in one place.
  callmebot_whatsapp:
    url: >-
      https://api.callmebot.com/whatsapp.php?phone={{ phone }}&apikey={{ apikey }}&text={{ text | urlencode }}
    method: get

  # Same Grafana Graphite-format annotation the host scripts (scripts/*.sh)
  # POST, but callable from any HA script/automation - used by the System
  # Maintenance card scripts so every button press leaves a mark on the
  # dashboards. tags/message are passed in by the calling script.
  grafana_annotation:
    url: "https://#{home_assistant_base_url}#:599/grafana/api/annotations/graphite"
    method: post
    headers:
      Authorization: "#{grafana_api_key}#"
      Content-Type: application/json
    payload: '{"tags": {{ tags | tojson }}, "data": "{{ message }}", "what": "Event Triggered"}'

timer:
  # restore: true — survive HA restarts (deploys). Without it a restart
  # resets the timer to idle without ever firing timer.finished, so the
  # heating_boost / adguard_protection_disabled input_booleans (and their
  # conditional Home-screen countdown cards) get stuck on forever.
  heating_boost:
    name: Heating Boost Timer
    duration: "00:30:00"
    icon: mdi:fire
    restore: true
  adguard_protection_disabled:
    name: AdGuard Protection Timer
    duration: "24:00:00"
    icon: mdi:shield-off
    restore: true
  kids_internet_block:
    name: Kids Internet Block Timer
    duration: "00:30:00"
    icon: mdi:timer-lock
    restore: true
  alerts_muted:
    name: Alerts Muted Timer
    duration: "01:00:00"
    icon: mdi:bell-off
    restore: true
  front_door_recent_activity:
    # event.front_door_motion / event.front_door_chime (Nest doorbell) fire a
    # point-in-time state change with no "on" duration of their own, so this
    # timer is what turns that into a Home-screen-conditional-card-friendly
    # "recently active" window - see the automations that start/stop it.
    name: Front Door Recent Activity Timer
    duration: "00:00:30"
    icon: mdi:doorbell-video
    restore: true

