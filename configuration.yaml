    - name: dc01
      state: '{{ states.binary_sensor.dc01.attributes.round_trip_time_avg }}'
      availability: '{{ is_state("binary_sensor.dc01", "on") and "round_trip_time_avg" in states.binary_sensor.dc01.attributes }}'
      unit_of_measurement: ms

    - name: desktop01
      state: '{{ states.binary_sensor.desktop01.attributes.round_trip_time_avg }}'
      availability: '{{ is_state("binary_sensor.desktop01", "on") and "round_trip_time_avg" in states.binary_sensor.desktop01.attributes }}'
      unit_of_measurement: ms

    - name: firewall
      state: '{{ states.binary_sensor.firewall.attributes.round_trip_time_avg }}'
      availability: '{{ is_state("binary_sensor.firewall", "on") and "round_trip_time_avg" in states.binary_sensor.firewall.attributes }}'
      unit_of_measurement: ms

    - name: plex01
      state: '{{ states.binary_sensor.plex01.attributes.round_trip_time_avg }}'
      availability: '{{ is_state("binary_sensor.plex01", "on") and "round_trip_time_avg" in states.binary_sensor.plex01.attributes }}'
