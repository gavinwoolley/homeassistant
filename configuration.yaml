  - sensor:
      # Firing alerts by severity, derived from the active_alerts REST
      # sensor's attribute payload so none of these poll Mimir a second time.
      # For tier="transient" hosts (laptops / dev VM - roaming DHCP, off during
      # the day, swallowed by Zscaler) only the "expected churn" alerts
      # (TargetDown, WindowsHostRebooted) are excluded here, from active_alerts,
      # and from the Alertmanager route - real problems on those hosts (CPU,
      # memory, disk, ...) still count and still page.
      - name: "Active Alerts Critical"
        unique_id: active_alerts_critical
        state: >-
          {% set ns = namespace(n=0) %}
          {% for a in state_attr('sensor.active_alerts', 'alerts') or [] %}
            {% if a.state == 'firing' and a.labels.severity == 'critical' and not (a.labels.get('tier') == 'transient' and a.labels.alertname in ['TargetDown', 'WindowsHostRebooted']) %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.n }}
        icon: mdi:alert-octagon

      - name: "Active Alerts Warning"
        unique_id: active_alerts_warning
        state: >-
          {% set ns = namespace(n=0) %}
          {% for a in state_attr('sensor.active_alerts', 'alerts') or [] %}
            {% if a.state == 'firing' and a.labels.severity == 'warning' and not (a.labels.get('tier') == 'transient' and a.labels.alertname in ['TargetDown', 'WindowsHostRebooted']) %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.n }}
        icon: mdi:alert

      - name: "Active Alerts Info"
        unique_id: active_alerts_info
        state: >-
          {% set ns = namespace(n=0) %}
          {% for a in state_attr('sensor.active_alerts', 'alerts') or [] %}
            {% if a.state == 'firing' and a.labels.severity == 'info' and not (a.labels.get('tier') == 'transient' and a.labels.alertname in ['TargetDown', 'WindowsHostRebooted']) %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.n }}
        icon: mdi:information

