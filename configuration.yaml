sensor 41:
  - platform: rest
    name: ha_latest_version
    unique_id: ha_latest_version
    resource: "https://version.home-assistant.io/stable.json"
    value_template: "{{ value_json.homeassistant.default }}"
    scan_interval: 3600

# Firing alerts from the Mimir ruler (Watchdog excluded). Goes unavailable if
# Mimir is unreachable - the monitoring watchdog covers that case.
sensor 81:
  - platform: rest
    name: active_alerts
    unique_id: active_alerts
    resource: "http://127.0.0.1:9009/prometheus/api/v1/alerts"
    scan_interval: 60
    value_template: >-
      {% set ns = namespace(n=0) %}
      {% for a in value_json.data.alerts %}
        {% if a.state == 'firing' and a.labels.alertname != 'Watchdog' and not (a.labels.get('tier') == 'transient' and a.labels.alertname in ['TargetDown', 'WindowsHostRebooted']) %}
          {% set ns.n = ns.n + 1 %}
        {% endif %}
      {% endfor %}
      {{ ns.n }}
    json_attributes_path: "$.data"
    json_attributes:
      - alerts

sensor 91:
  - platform: rest
    name: github_actions_latest_run
    unique_id: github_actions_latest_run
    resource: "https://api.github.com/repos/gavinwoolley/homeassistant/actions/workflows/demo-image.yml/runs?per_page=1"
    value_template: "{{ value_json.workflow_runs[0].status }}"
    scan_interval: 120
    json_attributes_path: "$.workflow_runs[0]"
    json_attributes:
      - conclusion
      - run_number
      - html_url
      - created_at
      - head_commit
  - platform: rest
    name: demo_image_published_version
    unique_id: demo_image_published_version
    resource: "https://raw.githubusercontent.com/gavinwoolley/homeassistant/main/.devcontainer/devcontainer.json"
    value_template: "{{ value_json.image.split(':')[-1] }}"
    scan_interval: 300
  - platform: rest
    name: demo_grafana_image_published_version
    unique_id: demo_grafana_image_published_version
    resource: "https://raw.githubusercontent.com/gavinwoolley/homeassistant/main/.devcontainer/grafana/docker-compose.codespaces.yml"
    value_template: >-
      {% set m = value | regex_findall('homeassistant-demo-grafana:(\S+)') %}
      {{ m[0] if m else 'unknown' }}
    scan_interval: 300
  - platform: rest
    name: azure_devops_pending_approvals
    unique_id: azure_devops_pending_approvals
    resource: "https://dev.azure.com/example/Home/_apis/pipelines/approvals?state=pending&api-version=7.1"
    authentication: basic
    # NOT an empty string - confirmed live (2026-09-25) that HA's own
    # rest/__init__.py only attaches auth at all when `if username and
    # password:` - an empty string username is falsy in Python, so this
    # sensor was silently sent with NO Authorization header whatsoever
    # despite a valid, correctly-scoped PAT sitting right there in
    # secrets.yaml. Azure DevOps responds to the resulting unauthenticated
    # request with a 203 + HTML sign-in page rather than a 401, which HA's
    # REST integration can't parse as JSON - exactly the failure mode this
    # branch's own final review flagged as a risk before this was ever
    # live-tested, now confirmed as the actual live bug. Azure DevOps PAT
    # auth ignores the username value entirely (only the password/PAT
    # matters), so any non-empty placeholder works - "pat" here is
    # arbitrary, not a real value.
    username: "pat"
    password: REDACTED azure_devops_pat
    value_template: "{{ value_json.count }}"
    scan_interval: 120
    json_attributes_path: "$"
    json_attributes:
      - value

