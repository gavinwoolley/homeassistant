    - name: food_waste_bin_done
      state: >-
        {{is_state('input_select.food_waste_bin', 'Done')}}

    # On when any Azure DevOps pipeline's latest build did not succeed
    # (failed / canceled / partiallySucceeded). Drives the conditional
    # "Pipeline Failure" banner on the Home view in ui-lovelace.yaml.
    - name: azure_pipeline_failure
      unique_id: azure_pipeline_failure
      icon: mdi:pipe-disconnected
      state: >-
        {% set ns = namespace(bad=false) %}
        {% for s in ['sensor.home_homeassistant_ci_latest_build',
                     'sensor.home_docker_compose_latest_build',
                     'sensor.home_publish_to_github_latest_build',
                     'sensor.home_homeassistant_latest_build'] %}
          {% if state_attr(s, 'result') not in ['succeeded', none] %}
            {% set ns.bad = true %}
          {% endif %}
        {% endfor %}
        {{ ns.bad }}
      attributes:
        # These 4 entity_ids match the 4 pipelines that actually exist as of
        # 2026-09-15 (the old Home-Assistant and AppDaemon pipelines were
        # deleted - unused for years - and their matching sensor slots
        # disappeared entirely on the next HA restart, rather than sticking
        # around stale; sensor.home_publish_to_github_latest_build didn't
        # exist at all until that same restart). Before this, the same
        # entity_id was observed reporting 3 different definition_names
        # across a few minutes of polling with no config change - so reading
        # each sensor's own definition_name attribute instead of a
        # hardcoded label is what actually keeps this correct if the
        # tracked-pipeline set ever changes again, not the entity_id list
        # itself.
        failed: >-
          {% set ns = namespace(items=[]) %}
          {% for s in ['sensor.home_homeassistant_ci_latest_build',
                       'sensor.home_docker_compose_latest_build',
                       'sensor.home_publish_to_github_latest_build',
                       'sensor.home_homeassistant_latest_build'] %}
            {% set r = state_attr(s, 'result') %}
            {% if r not in ['succeeded', none] %}
              {% set ns.items = ns.items + [{
                'name': (state_attr(s, 'definition_name') or 'Unknown') ~ ' Pipeline',
                'result': r,
                'build': states(s),
                'url': state_attr(s, 'url') }] %}
            {% endif %}
          {% endfor %}
          {{ ns.items }}

    # On while any tracked Azure DevOps pipeline's latest build is still
    # running (status inProgress). Drives the "Pipeline Running" banner on
    # the Home view in ui-lovelace.yaml. Polled by the integration (~5 min),
    # so very short builds may finish between polls without showing.
    - name: azure_pipeline_running
      unique_id: azure_pipeline_running
      icon: mdi:pipe
      state: >-
        {% set ns = namespace(busy=false) %}
        {% for s in ['sensor.home_homeassistant_ci_latest_build',
                     'sensor.home_docker_compose_latest_build',
                     'sensor.home_publish_to_github_latest_build',
                     'sensor.home_homeassistant_latest_build'] %}
          {% if state_attr(s, 'status') == 'inProgress' %}
            {% set ns.busy = true %}
          {% endif %}
        {% endfor %}
        {{ ns.busy }}
      attributes:
        # See the matching comment on azure_pipeline_failure above - reads
        # each sensor's own definition_name live instead of a hardcoded
        # entity_id -> label table.
        running: >-
          {% set ns = namespace(items=[]) %}
          {% for s in ['sensor.home_homeassistant_ci_latest_build',
                       'sensor.home_docker_compose_latest_build',
                       'sensor.home_publish_to_github_latest_build',
                       'sensor.home_homeassistant_latest_build'] %}
            {% if state_attr(s, 'status') == 'inProgress' %}
              {% set ns.items = ns.items + [{
                'name': (state_attr(s, 'definition_name') or 'Unknown') ~ ' Pipeline',
                'build': states(s),
                'started': state_attr(s, 'start_time'),
                'url': state_attr(s, 'url') }] %}
            {% endif %}
          {% endfor %}
          {{ ns.items }}

    - name: github_action_running
      unique_id: github_action_running
      icon: mdi:github
      state: "{{ is_state('sensor.github_actions_latest_run', 'in_progress') }}"
      attributes:
        running: >-
          {% if is_state('sensor.github_actions_latest_run', 'in_progress') %}
            {{ [{
              'name': 'Publish demo image',
              'build': state_attr('sensor.github_actions_latest_run', 'run_number'),
