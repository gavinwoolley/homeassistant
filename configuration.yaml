    - name: server1
      state: '{{ states.binary_sensor.server_1.attributes.round_trip_time_avg }}'
      availability: '{{ is_state("binary_sensor.server_1", "on") and "round_trip_time_avg" in states.binary_sensor.server_1.attributes }}'
      unit_of_measurement: ms

    - name: server2
      state: '{{ states.binary_sensor.server_2.attributes.round_trip_time_avg }}'
      availability: '{{ is_state("binary_sensor.server_2", "on") and "round_trip_time_avg" in states.binary_sensor.server_2.attributes }}'
      unit_of_measurement: ms

    - name: server3
      state: '{{ states.binary_sensor.server_3.attributes.round_trip_time_avg }}'
      availability: '{{ is_state("binary_sensor.server_3", "on") and "round_trip_time_avg" in states.binary_sensor.server_3.attributes }}'
      unit_of_measurement: ms

    - name: hp_switch
      state: '{{ states.binary_sensor.hp_switch.attributes.round_trip_time_avg }}'
      availability: '{{ is_state("binary_sensor.hp_switch", "on") and "round_trip_time_avg" in states.binary_sensor.hp_switch.attributes }}'
      unit_of_measurement: ms

    - name: wifi
      state: '{{ states.binary_sensor.unifi_ap.attributes.round_trip_time_avg }}'
      availability: '{{ is_state("binary_sensor.unifi_ap", "on") and "round_trip_time_avg" in states.binary_sensor.unifi_ap.attributes }}'
      unit_of_measurement: ms

    - name: wifi2
      state: '{{ states.binary_sensor.unifi_mesh.attributes.round_trip_time_avg }}'
      availability: '{{ is_state("binary_sensor.unifi_mesh", "on") and "round_trip_time_avg" in states.binary_sensor.unifi_mesh.attributes }}'
      unit_of_measurement: ms

    - name: wifi3
      state: '{{ states.binary_sensor.unifi_ap_2.attributes.round_trip_time_avg }}'
      availability: '{{ is_state("binary_sensor.unifi_ap_2", "on") and "round_trip_time_avg" in states.binary_sensor.unifi_ap_2.attributes }}'
