heating_boost_on:
  alias: Heating Boost on
  sequence:
  - action: input_boolean.turn_on
    data:
      entity_id: input_boolean.heating_boost
  - action: climate.set_hvac_mode
    data:
      entity_id: climate.lounge
      hvac_mode: heat
  - action: climate.set_temperature
    data:
      entity_id: climate.lounge
      temperature: '{{ (state_attr(''climate.lounge'', ''current_temperature'') |
        float(20) + 5) | round(0) | int }}'
  - action: timer.start
    data:
      entity_id: timer.heating_boost
      duration: '{{ ''{:02d}:{:02d}:00''.format((states(''input_number.heating_boost_minutes'')
        | int(30)) // 60, (states(''input_number.heating_boost_minutes'') | int(30))
        % 60) }}'
  mode: single
heating_boost_off:
  alias: Heating Boost Off
  sequence:
  - action: input_boolean.turn_off
    data:
      entity_id: input_boolean.heating_boost
  - action: timer.cancel
    data:
      entity_id: timer.heating_boost
  mode: single
