- id: mower_come_alive
  alias: Come Alive - Mower
  description: Sends the mower out to mow, moving it between a few spots in the garden, then back to dock - so the mower cards and any map plotting its position show it actually doing something instead of sitting docked forever.
  trigger:
    - trigger: time_pattern
      minutes: "/5"
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: lawn_mower.mower_demo
              state: docked
            - "{{ (range(0, 12) | random) < 1 }}"
          sequence:
            - action: lawn_mower.start_mowing
              target: {entity_id: lawn_mower.mower_demo}
            - action: input_select.select_option
              target: {entity_id: input_select.demo_mower_position}
              data:
                option: "{{ ['spot_1','spot_2','spot_3','spot_4'] | random }}"
        - conditions:
            - condition: state
              entity_id: lawn_mower.mower_demo
              state: mowing
          sequence:
            - choose:
                - conditions:
                    - "{{ (range(0, 10) | random) < 1 }}"
                  sequence:
                    - action: lawn_mower.dock
                      target: {entity_id: lawn_mower.mower_demo}
                    - action: input_select.select_option
                      target: {entity_id: input_select.demo_mower_position}
                      data:
                        option: dock
                - conditions:
                    - "{{ (range(0, 10) | random) < 2 }}"
                  sequence:
                    - action: lawn_mower.pause
                      target: {entity_id: lawn_mower.mower_demo}
              default:
                - action: input_select.select_option
                  target: {entity_id: input_select.demo_mower_position}
                  data:
                    option: "{{ ['spot_1','spot_2','spot_3','spot_4'] | random }}"
        - conditions:
            - condition: state
              entity_id: lawn_mower.mower_demo
              state: paused
          sequence:
            - choose:
                - conditions:
                    - "{{ (range(0, 10) | random) < 3 }}"
                  sequence:
                    - action: lawn_mower.dock
                      target: {entity_id: lawn_mower.mower_demo}
                    - action: input_select.select_option
                      target: {entity_id: input_select.demo_mower_position}
                      data:
                        option: dock
              default:
                - action: lawn_mower.start_mowing
                  target: {entity_id: lawn_mower.mower_demo}
  mode: single

