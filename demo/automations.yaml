              target: {entity_id: input_select.demo_dog_presence}
              data:
                option: escaped
        - conditions:
            - condition: state
              entity_id: input_select.demo_dog_presence
              state: walk
            - "{{ (range(0, 3) | random) < 1 }}"
          sequence:
            - action: input_select.select_option
              target: {entity_id: input_select.demo_dog_presence}
              data:
                option: home
        - conditions:
            - condition: state
              entity_id: input_select.demo_dog_presence
              state: escaped
            - "{{ (range(0, 4) | random) < 1 }}"
          sequence:
            - action: input_select.select_option
              target: {entity_id: input_select.demo_dog_presence}
              data:
                option: home
  mode: single

- id: setup_demo_grafana_token
  alias: Wire up the demo Grafana datasource token
  description: >-
    Runs demo/tools/setup_demo_grafana_token.py against this HA instance
    whenever it starts, so the optional Grafana add-on's "Home Assistant"
    datasource needs no manual step. No-op if the observability compose
    overlay isn't running (grafana-demo unreachable).
  trigger:
    - trigger: homeassistant
      event: start
  action:
    - repeat:
        count: 30
        sequence:
          - action: shell_command.setup_demo_grafana_token
            continue_on_error: true
          - delay:
              seconds: 60
  mode: single

- id: setup_demo_cameras
  alias: Set up demo cameras and moon integration
  description: >-
    Runs demo/tools/setup_demo_cameras.py against this HA instance whenever
    it starts, so the one-time camera/moon config-flow setup demo/README.md
    documents needs no manual step, including after a rename adds a camera
    object_id that's never existed before.
  trigger:
    - trigger: homeassistant
      event: start
  action:
    - repeat:
        count: 6
        sequence:
          - action: shell_command.setup_demo_cameras
            continue_on_error: true
          - delay:
              seconds: 20
  mode: single

- id: azure_devops_approval_come_alive
  alias: Come Alive - Azure DevOps Approval
  description: Occasionally toggles a fake "waiting on approval" state, so the demo's approval-pending popup shows up sometimes instead of never.
  trigger:
    - trigger: time_pattern
      minutes: "/5"
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.demo_azure_devops_approval_pending
              state: "off"
            - "{{ (range(0, 12) | random) < 1 }}"
          sequence:
            - action: input_boolean.turn_on
              target: {entity_id: input_boolean.demo_azure_devops_approval_pending}
        - conditions:
            - condition: state
              entity_id: input_boolean.demo_azure_devops_approval_pending
              state: "on"
            - "{{ (range(0, 6) | random) < 1 }}"
          sequence:
            - action: input_boolean.turn_off
              target: {entity_id: input_boolean.demo_azure_devops_approval_pending}
  mode: single

- id: irrigation_daily_schedule
  alias: Irrigation Daily Schedule
  description: Demo stand-in for the real irrigation scheduler.
  trigger:
    - trigger: time
      at: input_datetime.irrigation_start_time
  condition:
    - condition: state
      entity_id: input_boolean.irrigation_enabled
      state: "on"
  action:
    - action: logbook.log
      data:
        name: Irrigation
        message: demo irrigation cycle started
  mode: single
