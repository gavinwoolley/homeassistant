- id: printer_come_alive
  alias: Come Alive - 3D Printer
  description: Cycles the 3D printer through prepare -> running -> (occasional pause) -> idle, roughly once an hour, so the "Print job running" conditional card actually appears sometimes instead of staying permanently idle.
  trigger:
    - trigger: time_pattern
      minutes: "/5"
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.demo_printer_status
              state: idle
            - "{{ (range(0, 12) | random) < 1 }}"
          sequence:
            - action: input_select.select_option
              target: {entity_id: input_select.demo_printer_status}
              data:
                option: prepare
        - conditions:
            - condition: state
              entity_id: input_select.demo_printer_status
              state: prepare
          sequence:
            - action: input_select.select_option
              target: {entity_id: input_select.demo_printer_status}
              data:
                option: running
        - conditions:
            - condition: state
              entity_id: input_select.demo_printer_status
              state: running
          sequence:
            - action: input_select.select_option
              target: {entity_id: input_select.demo_printer_status}
              data:
                option: "{{ (['running','running','running','running','running','running','pause','idle'] | random) }}"
        - conditions:
            - condition: state
              entity_id: input_select.demo_printer_status
              state: pause
          sequence:
            - action: input_select.select_option
              target: {entity_id: input_select.demo_printer_status}
              data:
                option: running
  mode: single

