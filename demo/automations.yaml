- id: come_alive_random_climate
  alias: Come Alive - Random Climate Cycle
  description: Occasionally turns a random AC/thermostat on or off, so the panel doesn't show every unit heating at once.
  trigger:
    - trigger: time_pattern
      minutes: "/5"
  variables:
    lively_climate: '{{ ["climate.bart_simpson_room_2", "climate.lisa_simpson_room", "climate.kitchen_2", "climate.lounge", "climate.master_bedroom", "climate.office", "climate.upstairs"] | random }}'
  action:
    - choose:
        - conditions:
            - "{{ not is_state(lively_climate, 'off') and (range(0, 10) | random) < 6 }}"
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: "{{ lively_climate }}"
              data:
                hvac_mode: "off"
