- id: dog_come_and_go
  alias: Dog - Walks and Wandering
  description: >-
    Dog stays home unless someone is actually around to take him for a
    walk - occasionally wanders off on his own if the house is empty, which
    reads as "escaped" rather than a legitimate walk.
  trigger:
    - trigger: time_pattern
      minutes: "/8"
  variables:
    someone_home: "{{ is_state('person.homer_simpson', 'home') or is_state('person.marge_simpson', 'home') or is_state('person.bart_simpson', 'home') or is_state('person.lisa_simpson', 'home') }}"
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.demo_dog_presence
              state: home
            - "{{ someone_home and (range(0, 10) | random) < 1 }}"
          sequence:
            - action: input_select.select_option
              target: {entity_id: input_select.demo_dog_presence}
              data:
                option: walk
        - conditions:
            - condition: state
              entity_id: input_select.demo_dog_presence
              state: home
            - "{{ not someone_home and (range(0, 40) | random) < 1 }}"
          sequence:
            - action: input_select.select_option
              target: {entity_id: input_select.demo_dog_presence}
              data:
                option: escaped
        - conditions:
            - condition: state
              entity_id: input_select.demo_dog_presence
              state: walk
            - "{{ (range(0, 3) | random) < 1 }}"
          sequence:
            - action: input_select.select_option
              target: {entity_id: input_select.demo_dog_presence}
              data:
                option: home
        - conditions:
            - condition: state
              entity_id: input_select.demo_dog_presence
              state: escaped
            - "{{ (range(0, 4) | random) < 1 }}"
          sequence:
            - action: input_select.select_option
              target: {entity_id: input_select.demo_dog_presence}
              data:
                option: home
  mode: single

