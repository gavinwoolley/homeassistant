  weather:
      - name: "Home Homer Simpson Com"
        unique_id: demo_wx_home_homer_simpson_com
        condition: >-
          {{ ['sunny', 'partlycloudy', 'cloudy', 'rainy', 'clear-night', 'windy'] | random }}
        temperature: "{{ states('sensor.outside_temperature') | float(18) }}"
        humidity: "{{ range(55, 85) | random }}"
        forecast_daily: >-
          {% set conditions = ['sunny', 'partlycloudy', 'cloudy', 'rainy', 'clear-night', 'windy'] %}
          {% set base = states('sensor.outside_temperature') | float(18) %}
          {% set ns = namespace(days=[]) %}
          {% for i in range(5) %}
          {% set ns.days = ns.days + [{
            'datetime': (now() + timedelta(days=i)).strftime('%Y-%m-%d'),
            'condition': conditions | random,
            'native_temperature': base + (range(-2, 4) | random),
            'native_templow': base - (range(2, 6) | random),
          }] %}
          {% endfor %}
          {{ ns.days }}
