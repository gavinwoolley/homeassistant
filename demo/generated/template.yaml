- sensor:
      - name: "Bart Simpson"
        unique_id: demo_sn_bart_simpson
        state: >-
          {% set s = states('person.bart_simpson') %}{{ 'Home' if s == 'home' else ('Away' if s == 'not_home' else s) }}
      - name: "Homer Simpson"
        unique_id: demo_sn_homer_simpson
        state: >-
          {% set s = states('person.homer_simpson') %}{{ 'Home' if s == 'home' else ('Away' if s == 'not_home' else s) }}
      - name: "Homer Simpson Towards Home"
        unique_id: demo_sn_homer_simpson_towards_home
        state: >-
          {{ 'on' if is_state('input_select.demo_homer_simpson_presence', 'heading_home') else 'off' }}
      - name: "Dog"
        unique_id: demo_sn_dog
        state: >-
          {% set s = states('person.dog') %}{{ 'Home' if s == 'home' else ('Away' if s == 'not_home' else s) }}
      - name: "Lisa Simpson"
        unique_id: demo_sn_lisa_simpson
        state: >-
          {% set s = states('person.lisa_simpson') %}{{ 'Home' if s == 'home' else ('Away' if s == 'not_home' else s) }}
      - name: "Marge Simpson"
        unique_id: demo_sn_marge_simpson
        state: >-
          {% set s = states('person.marge_simpson') %}{{ 'Home' if s == 'home' else ('Away' if s == 'not_home' else s) }}
      - name: "Marge Simpson Towards Home"
        unique_id: demo_sn_marge_simpson_towards_home
        state: >-
          {{ 'on' if is_state('input_select.demo_marge_simpson_presence', 'heading_home') else 'off' }}
      - name: "P2S 22e8bj620203679 Current Stage"
        unique_id: demo_sn_p2s_22e8bj620203679_current_stage
        state: >-
          {% set s = states('input_select.demo_printer_status') %}{{ {'idle': 'Idle', 'prepare': 'Heating & Levelling', 'running': 'Printing', 'pause': 'Paused'}.get(s, 'Idle') }}
