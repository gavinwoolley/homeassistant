# Backs the "Wire up the demo Grafana datasource token" automation
# (demo/tools/generate_demo_entities.py), which does the retrying itself
# (repeat/delay, no ceiling) - a single, direct call here, NOT a shell-level
# retry loop. Confirmed live: HA's shell_command integration hard-kills any
# command still running after 60s, no YAML-configurable override - an
# earlier version of this wrapped the call in `sh -c 'while ...'` retrying
# for up to 2.5 minutes, which got killed by that ceiling on every single
# invocation and logged an error every time, never actually reaching a late
# retry that might have succeeded. /config is this container's mount of
# demo/ (see demo/docker-compose.demo.yml), so demo/tools/ lands at
# /config/tools/. Confirmed live: the stock homeassistant/home-assistant
# image has aiohttp already importable via its own python3, no extra
# install needed.
shell_command:
  setup_demo_grafana_token: >-
    python3 /config/tools/setup_demo_grafana_token.py
    --ha-base-url http://localhost:8123
    --grafana-base-url http://grafana-demo:3000
    --username demo --password demo
  # Same "can the manual step be automated" answer as the Grafana token
  # above: yes, it's the same script demo/README.md's one-time setup step
  # already documents, just run by HA itself instead of by hand. Idempotent
  # (README: "Safe to re-run - already-created entries are detected and
  # skipped") - covers both first-boot (creates all 18 cameras + moon) and
  # every later boot after an entity rename adds a new camera object_id that
  # was never created before (confirmed live 2026-09-23: exactly this
  # happened after the Homer Simpson/Dog->Simpsons rename).
  setup_demo_cameras: >-
    python3 /config/tools/setup_demo_cameras.py
    --base-url http://localhost:8123
    --username demo --password demo

# The real dashboard leans heavily on HACS-installed custom Lovelace cards
# (mushroom-*, mini-graph-card, vacuum-card, config-template-card, etc.) -
# without registering the same JS bundles here, every card of those types
# falls back to "Configuration error". Vendored as plain static files under
# www/community/ (matching each card's real HACS folder name) rather than
# installing HACS itself in this throwaway instance - these are just
# browser-loadable frontend assets, same as any other /local/ file.
#
# The real dashboard's clock/weather picture-elements card (and 9 other
# card_mod: usages) rely on var(--card-background-color) resolving through
# a custom dark theme, not HA's stock default - without one registered here
# it fell back to the stock light-grey theme, so the same card_mod that
# looks like a styled black background on the real system just looked like
# a flat grey card here. themes/midnight_springfield.yaml is the real repo's
# themes/midnight_homer_simpson.yaml (the only theme actually in use - every other
# theme file that ever accumulated there got cleaned up as dead weight),
# copied in with the filename/theme key renamed since both literally
# contained the real first name.
frontend:
  themes: !include_dir_merge_named themes

# `mode: yaml` at the top level (rather than under dashboards:) is deprecated
# as of 2026.8 - resource_mode: yaml + an explicit dashboards: entry is the
# replacement HA's own repair warning asks for; resource_mode: yaml keeps
# resources: below loading from this file instead of migrating to the UI.
lovelace:
  resource_mode: yaml
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Overview
      icon: mdi:view-dashboard
      show_in_sidebar: true
    # The real sidebar links out to 8 other real self-hosted services
    # (BlueIris/Grafana/Plex/Coder/Portainer/AdGuard/Alloy/UniFi) via
    # storage-mode `strategy: {type: iframe, url: ...}` dashboards (see
    # .storage/lovelace.dashboard_* on the real host - not YAML, not
    # git-tracked, so nothing to copy directly) plus HACS's own native
    # integration panel. None of those services exist for the demo to
    # actually embed, so these are plain single-card dashboards showing an
    # original placeholder graphic instead - same sidebar look, but nothing
    # pretends to be a live connection to a real service.
    dashboard-cctv:
      mode: yaml
      filename: panels/cctv.yaml
      title: CCTV
      icon: mdi:cctv
      show_in_sidebar: true
    dashboard-grafana:
      mode: yaml
      filename: panels/grafana.yaml
      title: Grafana
      icon: mdi:chart-timeline
      show_in_sidebar: true
    dashboard-plex:
      mode: yaml
      filename: panels/plex.yaml
      title: Plex
      icon: mdi:plex
      show_in_sidebar: true
    dashboard-coder:
      mode: yaml
      filename: panels/coder.yaml
      title: Coder
      icon: mdi:microsoft-visual-studio-code
      show_in_sidebar: true
    dashboard-portainer:
      mode: yaml
      filename: panels/portainer.yaml
      title: Portainer
      icon: mdi:docker
      show_in_sidebar: true
    dashboard-adguard:
      mode: yaml
      filename: panels/adguard.yaml
      title: AdGuard
      icon: mdi:police-badge-outline
      show_in_sidebar: true
    dashboard-alloy:
      mode: yaml
      filename: panels/alloy.yaml
      title: Alloy
      icon: mdi:chart-timeline-variant-shimmer
      show_in_sidebar: true
    unifi-controller:
      mode: yaml
      filename: panels/unifi-controller.yaml
      title: Unifi
      icon: mdi:router-wireless
      show_in_sidebar: true
    dashboard-hacs:
      mode: yaml
      filename: panels/hacs.yaml
      title: HACS
      icon: mdi:puzzle
      show_in_sidebar: true
  resources:
    - url: /local/community/lovelace-mushroom/mushroom.js
      type: module
    - url: /local/community/lovelace-card-mod/card-mod.js
      type: module
    - url: /local/community/mini-graph-card/mini-graph-card-bundle.js
      type: module
    - url: /local/community/vacuum-card/vacuum-card.js
      type: module
    - url: /local/community/atomic-calendar-revive/atomic-calendar-revive.js
      type: module
    - url: /local/community/button-card/button-card.js
      type: module
    - url: /local/community/lovelace-layout-card/layout-card.js
      type: module
    - url: /local/community/lovelace-hui-element/hui-element.js
      type: module
    - url: /local/community/config-template-card/config-template-card.js
      type: module
    - url: /local/community/custom-icons/custom-icons.js
      type: module
    - url: /local/community/custom-ui/custom-ui.js
      type: module
    - url: /local/community/tabbed-card/tabbed-card.js
      type: module
    - url: /local/community/timeline_card/timeline_card.js
      type: module
    - url: /local/community/ha-bambulab-cards/ha-bambulab-cards.js
      type: module
    - url: /local/irrigation-map.js
