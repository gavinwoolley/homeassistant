#3D Printer Safe Toggle
toggle_3d_printer_safe:
  alias: Toggle 3D Printer (Safe)
  sequence:
    - if:
        - condition: state
          entity_id: switch.smart_plug_4_socket_1
          state: 'on'
        - condition: or
          conditions:
            - condition: state
              entity_id: sensor.p2s_22e8bj620203679_print_status
              state:
                - prepare
                - slicing
                - running
                - pause
            - condition: state
              entity_id: binary_sensor.p2s_22e8bj620203679_ams_1_drying
              state: 'on'
      then:
        - service: persistent_notification.create
          data:
            title: 3D Printer
            message: Blocked power-off — the printer is currently working.
      else:
        - service: switch.toggle
          data:
            entity_id: switch.smart_plug_4_socket_1

