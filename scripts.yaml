  #Projector Remote Scripts
projector_down:
  alias: Projector Screen Down
  sequence:
    - service: switch.turn_on
      data:
        entity_id: switch.projector_screen_down
    - delay:
        seconds: 30
    - service: switch.turn_off
      data:
        entity_id: switch.projector_screen_down
    - delay:
        seconds: 1
projector_up:
  alias: Projector Screen Up
  sequence:
    - service: switch.turn_on
      data:
        entity_id: switch.projector_screen_up
    - delay:
        seconds: 60
    - service: switch.turn_off
      data:
        entity_id: switch.projector_screen_up
    - delay:
        seconds: 1

#TV Remote Learn Scripts
learn:
  alias: Learn Command
  sequence:
    - service: broadlink.learn
      data:
        host: 10.0.0.121

#Remove IP Ban - delete the ban list then restart HA to apply
remove_ip_ban:
  alias: Remove IP Ban
  sequence:
    - service: rest_command.grafana_annotation
      data:
        tags: ["Cleared IP Ban List", "HomeAssistant", "Server"]
        message: "Home Assistant - Cleared IP Ban List"
    - service: shell_command.remove_ip_ban
    - delay: "00:00:02"
    - service: homeassistant.restart

reload_all_yaml:
  alias: Reload All YAML
  sequence:
    - service: rest_command.grafana_annotation
      data:
        tags: ["Reload", "HomeAssistant", "YAML"]
        message: "Home Assistant - YAML Config Reloaded"
    - service: homeassistant.reload_all

