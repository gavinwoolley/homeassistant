# Homer Simpson Laptop Wake on LAN
homer_simpson_laptop_wake_full:
  alias: Homer Simpson Laptop - Turn On and Wake
  sequence:
    - service: switch.turn_on
      target:
        entity_id: switch.smart_plug_6_socket_1
    - delay:
        seconds: 10
    - service: wake_on_lan.send_magic_packet
      data:
        mac: "ba:95:06:5b:30:5d"
        broadcast_address: "10.0.0.104"

homer_simpson_laptop_wol_only:
  alias: Homer Simpson Laptop - Wake on LAN Only
  sequence:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.homer_simpson_laptop_wol_pulse
    - service: wake_on_lan.send_magic_packet
      data:
        mac: "ba:95:06:5b:30:5d"
        broadcast_address: "10.0.0.104"
    - delay:
        seconds: 2
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.homer_simpson_laptop_wol_pulse

# --- Monitoring / alert notifications ------------------------------------------

# Single place the CallMeBot phone + apikey secrets are referenced. Callers
# just pass `message`.
notify_whatsapp:
  alias: "Notify: WhatsApp (CallMeBot)"
  mode: queued
  max: 20
  fields:
    message:
      description: Text to send
  sequence:
    - service: rest_command.callmebot_whatsapp
      data:
        phone: !secret callmebot_phone
        apikey: REDACTED callmebot_apikey
        text: "{{ message }}"
    # CallMeBot is slow and serialises poorly - space out queued messages.
    - delay:
        seconds: 4
