intruder_alert:
  alias: Intruder Alert
  mode: restart
  sequence:
    - service: html5.send_message
      target:
        label_id: push_devices
      continue_on_error: true
      data:
        title: Intruder Alert Activated
        message: The intruder alert is sounding. Use the action below to stop it.
        actions:
          - action: cancel_alerts
            icon: "/local/Alarm-128.png"
            title: Cancel Alerts
        tag: intruder_alert_active
    - service: script.all_lights_on
      continue_on_error: true
    - service: switch.turn_on
      continue_on_error: true
      data:
        entity_id:
          - switch.disco_ball_socket_1
          - switch.smoke_machine_socket_1
    # Wake the TVs via CEC so they are audible group members; group casts
    # alone do not power on a TV
    - service: media_player.turn_on
      continue_on_error: true
      data:
        entity_id:
          - media_player.chromecast1049 # Lounge TV
          - media_player.chromecast6664 # Bart Simpson TV
    - service: media_player.volume_set
      continue_on_error: true
      data:
        entity_id:
          - media_player.chromecast1049
          - media_player.chromecast6664
        volume_level: 1.0
    # All voice and siren casts go through the Google speaker group so
    # every device plays in perfect sync (individual casts drift and echo)
    - service: media_player.volume_set
      continue_on_error: true
      data:
        entity_id: media_player.home_group
        volume_level: 1.0
    # Opening line on every speaker
    - service: tts.cloud_say
      continue_on_error: true
      data:
        entity_id: media_player.home_group
        message: "Hello Homer Simpson... no. You are not Homer Simpson."
        options:
          voice: RyanNeural
        language: en-GB
    - delay: "00:00:05"
    # Alternate siren bursts and voice lines. TTS interrupts the tone;
    # the next loop restarts it, so it reads as tone -> voice -> tone.
    - repeat:
        for_each:
          - message: "Facial recognition complete. You are not a resident. Your face, height, and clothing have been captured in 4K and stored off site. Damaging the cameras will not remove the footage."
            speech_time: 13
          - message: "The homeowner and the neighbours have been sent your images and are watching the live feed now."
            speech_time: 8
          - message: "Everything you do from this point is evidence. Leave now."
            speech_time: 6
        sequence:
          - service: media_player.play_media
            continue_on_error: true
            data:
              entity_id: media_player.home_group
              media_content_id: "https://home.example.com:8123/local/intruder_alert.mp3"
              media_content_type: music
          - delay: "00:00:10"
          - service: tts.cloud_say
            continue_on_error: true
            data:
              entity_id: media_player.home_group
              message: "{{ repeat.item.message }}"
              options:
                voice: RyanNeural
              language: en-GB
          - delay:
              seconds: "{{ repeat.item.speech_time }}"
    # Keep the siren going for ~10 minutes (replayed every 60s), then
    # stand down automatically if nobody has pressed Cancel Alerts
    - repeat:
        count: 10
        sequence:
          - service: media_player.play_media
            continue_on_error: true
            data:
              entity_id: media_player.home_group
              media_content_id: "https://home.example.com:8123/local/intruder_alert.mp3"
              media_content_type: music
          - delay: "00:01:00"
    - service: script.turn_on
      entity_id: script.cancel_alerts

cancel_alerts:
  alias: Cancel Alerts
  sequence:
    - service: script.turn_off
      continue_on_error: true
      entity_id:
        - script.intruder_alert
        - script.tv_lamp_on
    # Stop the speaker group and TVs individually so one failed/idle Cast
    # device cannot abort the whole cancel
    - repeat:
        for_each:
          - media_player.home_group
          - media_player.chromecast1049 # Lounge TV
          - media_player.chromecast6664 # Bart Simpson TV
        sequence:
          - service: media_player.media_stop
            continue_on_error: true
            data:
              entity_id: "{{ repeat.item }}"
          - service: media_player.volume_set
            continue_on_error: true
            data:
              entity_id: "{{ repeat.item }}"
              volume_level: 0.4
    # Put the TVs back into standby after the alert woke them
    - service: media_player.turn_off
      continue_on_error: true
      data:
        entity_id:
          - media_player.chromecast1049
          - media_player.chromecast6664
    - service: switch.turn_off
      continue_on_error: true
      data:
        entity_id:
          - switch.disco_ball_socket_1
          - switch.smoke_machine_socket_1
    # Everything off; if it's evening before midnight, re-light the door
    # number light to match the normal driveway lighting schedule
    - service: script.all_lights_off
      continue_on_error: true
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ is_state('sun.sun', 'below_horizon') and now().hour >= 12 }}"
          sequence:
            - service: switch.turn_on
              continue_on_error: true
              data:
                entity_id: switch.door_number_light_socket
    - service: html5.send_message
      target:
        label_id: push_devices
      data:
        title: Alerts Cancelled
        message: All alerts and simulations stopped, speaker volume reset.
        tag: alerts_cancelled

