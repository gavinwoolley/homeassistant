# Kids Internet Block - UniFi "block client" on a set of kids' devices for the
# window picked in input_select.kids_block_duration. The *_blocked switch is ON
# when the client is allowed, so blocking = switch.turn_off.
kids_internet_block:
  alias: Kids Internet - Block
  mode: restart
  fields:
    switches:
      description: block-switch entity_ids to turn off (default = all kids devices)
      example: "[switch.ipad_blocked]"
  variables:
    all_devices: &kids_block_switches
      - switch.loungerokutv_blocked
      - switch.lisa_simpson_roku_tv_blocked
      - switch.kitchen_display_blocked
      - switch.bedroom_display_blocked
      - switch.bart_simpson_tv_blocked
      - switch.lisa_simpson_mac_book_blocked
      - switch.pixel_6_pro_blocked
      - switch.ipad_blocked
    target: "{{ switches | default(all_devices, true) }}"
  sequence:
    - service: switch.turn_off
      target:
        entity_id: "{{ target }}"
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.kids_internet_blocked
    - service: timer.start
      target:
        entity_id: timer.kids_internet_block
      data:
        duration: >-
          {% set d = states('input_select.kids_block_duration') %}
          {%- if d == '10 minutes' -%}600
          {%- elif d == '30 minutes' -%}1800
          {%- elif d == '1 hour' -%}3600
          {%- elif d == '2 hours' -%}7200
          {%- elif d == 'Until midnight' -%}{{ ((today_at('00:00') + timedelta(days=1)) - now()).total_seconds() | int }}
          {%- else -%}1800{%- endif -%}

kids_internet_restore:
  alias: Kids Internet - Restore
  mode: restart
  sequence:
    - service: timer.cancel
      target:
        entity_id: timer.kids_internet_block
    - service: switch.turn_on
      target:
        entity_id: *kids_block_switches
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.kids_internet_blocked

