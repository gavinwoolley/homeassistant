#Heating / Electricity Scripts
heating_boost_on:
  alias: Heating Boost On
  sequence:
    - service: scene.create
      data:
        scene_id: pre_boost_lounge
        snapshot_entities:
          - climate.lounge
    - service: input_boolean.turn_on
      data:
        entity_id: input_boolean.heating_boost
    - service: climate.set_hvac_mode
      data:
        entity_id: climate.lounge
        hvac_mode: heat
    - service: climate.set_temperature
      data:
        entity_id: climate.lounge
        temperature: "{{ (state_attr('climate.lounge', 'current_temperature') | float(20) + 5) | round(0) | int }}"
    - service: timer.start
      data:
        entity_id: timer.heating_boost
        duration: >-
          {% set mins = states('input_number.heating_boost_minutes') | int(30) %}
          {{ '{:02d}:{:02d}:00'.format(mins // 60, mins % 60) }}

heating_boost_off:
  alias: Heating Boost Off
  sequence:
    - service: input_boolean.turn_off
      data:
        entity_id: input_boolean.heating_boost
    - service: timer.cancel
      data:
        entity_id: timer.heating_boost
    - service: scene.turn_on
      data:
        entity_id: scene.pre_boost_lounge

#System Maintenance
purge_data_5:
  sequence:
    - service: recorder.purge
      data:
        keep_days: 5
restart_home_assistant_service:
  alias: Restart Home Assistant
  sequence:
    - service: rest_command.grafana_annotation
      data:
        tags: ["Restart", "HomeAssistant", "Service"]
        message: "Home Assistant - Service Restarted"
    - service: homeassistant.restart
reload_lovelace:
  alias: Reload Lovelace
  # homeassistant.reload_all (script.reload_all_yaml) does NOT reload the
  # yaml-mode Lovelace dashboard - lovelace.reload is its own service.
  sequence:
    - service: rest_command.grafana_annotation
      data:
        tags: ["Reload", "HomeAssistant", "Lovelace"]
        message: "Home Assistant - Lovelace Reloaded"
    - service: lovelace.reload
restart_appdaemon:
  sequence:
    - service: switch.turn_on
      entity_id: switch.restart_appdaemon
reboot_system:
  alias: Restart Home Assistant
  sequence:
    - service: homeassistant.restart
#Media Extractor
#TVs ON Script
tv_lamp_on_confirm:
  alias: TV and Lights On Confirm
  sequence:
    - service: html5.send_message
      target:
        label_id: push_devices
      data:
        title: Confirm TV / Lights On Action
        message: Someone pressed the TV and lights on alert, do you want to continue
        actions:
          - action: tv_lamp_on_confirm
            icon: "/local/tv.png"
            title: Activate TV / Lights On Confirm
        tag: 'tv_lamp_on_confirm_check_{{ now().strftime("%Y%m%d-%H%M%S") }}'

tv_lamp_on:
  alias: TV and Lights On
  sequence:
    - service: html5.send_message
      target:
        label_id: push_devices
      continue_on_error: true
      data:
        title: TV / Lights On Running
        message: Occupancy simulation is running. Use the action below to stop it.
        actions:
          - action: cancel_alerts
            icon: "/local/tv.png"
            title: Cancel Alerts
        tag: tv_lamp_on_active
    # Light the TVs up with the local camera stream (YouTube is blocked)
    - service: media_player.play_media
      continue_on_error: true
      data:
        entity_id: media_player.chromecast1049
        media_content_id: "http://10.0.0.250:81/mjpg/index?/video.mjpg"
        media_content_type: image/jpg
    - service: media_player.play_media
      continue_on_error: true
      data:
        entity_id: media_player.chromecast6664
        media_content_id: "http://10.0.0.250:81/mjpg/index?/video.mjpg"
        media_content_type: image/jpg
    - service: script.all_lights_on
      continue_on_error: true
    - delay: "00:00:{{ (range(50, 1000)|random|int) }}"
    - service: remote.send_command
      continue_on_error: true
      data:
        entity_id: remote.lounge_roku_tv
        command:
          - power
    - service: script.all_lights_off
      continue_on_error: true
    - service: media_player.media_stop
      continue_on_error: true
      data:
        entity_id:
          - media_player.chromecast1049
          - media_player.chromecast6664

