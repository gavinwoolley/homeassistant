garden_lights_and_sound:
  alias: Garden Lights and Sound
  sequence:
    - service: switch.turn_on
      data:
        entity_id: switch.gardenpath
    - service: switch.turn_on
      data:
        entity_id: switch.garden_tree_light_switch
    - service: switch.turn_on
      data:
        entity_id: switch.tree_house_light_socket
    - service: media_player.volume_set
      data:
        entity_id: media_player.googlehome6669
        volume_level: 1.0
    - service: tts.cloud_say
      data_template:
        entity_id: media_player.googlehome6669
        message: "Motion has been detected in the garden. Checking known faces...  No Match Found... Continuing to phase 2.. You have 30s to cancel..."
        options:
          voice: RyanNeural
        language: en-GB
    - service: media_player.play_media
      data:
