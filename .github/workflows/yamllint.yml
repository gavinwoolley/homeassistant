name: yamllint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install --quiet yamllint

      - name: yamllint
        run: yamllint -c .yamllint .
