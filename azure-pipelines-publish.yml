name: $(Major).$(Minor).$(Patch)

# Manual only - this doesn't build/deploy anything in the private stack, it
# produces the sanitized public mirror at github.com/homer_simpson/homeassistant.
# Uncomment the schedule below for an unattended weekly re-sync once this has
# been run manually a few times and the Publish stage's approval gate feels
# like a formality rather than something you actually want to review.
trigger: none
pr: none

# schedules:
# - cron: "0 6 * * 1"
#   displayName: Weekly public mirror sync
#   branches:
#     include:
#     - master
#   always: true

pool:
  name: Local Ubuntu

variables:
  Major: 1
  Minor: 0
  Patch: $[counter(format('{0}.{1}', variables['Major'], variables['Minor']), 0)]

resources:
- repo: self

stages:
- stage: Sanitize
  displayName: Sanitize
  jobs:
  - job: Build
    displayName: Assemble and gate the sanitized tree
    workspace:
      clean: all
    steps:
    - checkout: self
      fetchDepth: 1
      persistCredentials: false

    - task: DownloadSecureFile@1
      displayName: 'Download real-value map'
      name: replacementsMap
      inputs:
        secureFile: replacements.local.yaml

    - task: DownloadSecureFile@1
      displayName: 'Download real-filename denylist'
      name: denylistLocal
      inputs:
        secureFile: denylist.local.txt

    - bash: |
        mkdir -p publish/config
        cp "$(replacementsMap.secureFilePath)" publish/config/replacements.local.yaml
        cp "$(denylistLocal.secureFilePath)" publish/config/denylist.local.txt
      displayName: 'Place real-value map and denylist'

    - bash: |
        set -e
        # This agent's OS default `python3` is 3.6 (Ubuntu 18.04) - too old for
        # sanitize.py's `from __future__ import annotations` (needs 3.7+).
        # python3.9 is installed alongside it but shares the box's ancient,
        # broken system pip (a stale setuptools wheel that fails to import
        # under 3.8/3.9 - confirmed live: `AttributeError: 'HTMLParser' object
        # has no attribute 'unescape'`), so bootstrap a real one for 3.9
        # specifically rather than relying on whatever pip happens to resolve.
        curl -sL https://bootstrap.pypa.io/pip/3.9/get-pip.py | python3.9 - --user --quiet
        python3.9 -m pip install --quiet --user pyyaml yamllint
      displayName: 'Install Python dependencies'

    - bash: |
        set -e
        VERSION=8.21.2
        mkdir -p "$(Agent.TempDirectory)/gitleaks-bin"
        curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
          | tar xz -C "$(Agent.TempDirectory)/gitleaks-bin" gitleaks
        echo "##vso[task.prependpath]$(Agent.TempDirectory)/gitleaks-bin"
        "$(Agent.TempDirectory)/gitleaks-bin/gitleaks" version
      displayName: 'Install gitleaks (pinned)'

    - bash: |
        python3.9 publish/sanitize.py \
          --dry-run --strict \
          --out "$(Build.ArtifactStagingDirectory)/mirror" \
          --report "$(Build.ArtifactStagingDirectory)/report"
      displayName: 'Run sanitizer (dry-run, all gates enforced)'

    - bash: |
        docker run --rm \
          -e PYTHONDONTWRITEBYTECODE=1 \
          -v "$(Build.ArtifactStagingDirectory)/mirror:/config" \
          homeassistant/home-assistant:stable \
          python -m homeassistant --script check_config --config /config
      displayName: 'HA check_config on the sanitized tree'

    - publish: $(Build.ArtifactStagingDirectory)/report
      artifact: sanitize-report
      displayName: 'Publish sanitize-report artifact'

    - publish: $(Build.ArtifactStagingDirectory)/mirror
      artifact: sanitized-tree
      displayName: 'Publish sanitized-tree artifact (audit copy of this sync)'

- stage: Publish
  displayName: Publish
  dependsOn: Sanitize
  condition: succeeded()
  jobs:
  - deployment: Push
    displayName: Force-push to the public GitHub repo
    # The public-mirror Environment's approval check is the human gate here -
    # review the sanitize-report/sanitized-tree artifacts from the Sanitize
    # stage before approving. This stage re-runs the sanitizer rather than
    # reusing those artifacts directly, since sanitize.py --push does the
    # whole assemble/redact/gate/push sequence in one shot - deterministic
    # against the same commit, so the result matches what was reviewed.
    environment: public-mirror
    pool:
      name: Local Ubuntu
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false

          - task: DownloadSecureFile@1
            displayName: 'Download real-value map'
            name: replacementsMap
            inputs:
              secureFile: replacements.local.yaml

          - task: DownloadSecureFile@1
            displayName: 'Download real-filename denylist'
            name: denylistLocal
            inputs:
              secureFile: denylist.local.txt

          - bash: |
              mkdir -p publish/config
              cp "$(replacementsMap.secureFilePath)" publish/config/replacements.local.yaml
              cp "$(denylistLocal.secureFilePath)" publish/config/denylist.local.txt
            displayName: 'Place real-value map and denylist'

          - bash: |
              set -e
              # See the Sanitize stage's matching step - same agent, same fix.
              curl -sL https://bootstrap.pypa.io/pip/3.9/get-pip.py | python3.9 - --user --quiet
              python3.9 -m pip install --quiet --user pyyaml yamllint
            displayName: 'Install Python dependencies'

          - bash: |
              set -e
              VERSION=8.21.2
              mkdir -p "$(Agent.TempDirectory)/gitleaks-bin"
              curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
                | tar xz -C "$(Agent.TempDirectory)/gitleaks-bin" gitleaks
              echo "##vso[task.prependpath]$(Agent.TempDirectory)/gitleaks-bin"
            displayName: 'Install gitleaks (pinned)'

          - bash: |
              python3.9 publish/sanitize.py --push --strict
            displayName: 'Sanitize + force-push to GitHub'
            env:
              GITHUB_PAT: $(GITHUB_PAT)
