                color: "#ef5350"
              - entity: sensor.pixel_10_pro_resting_heart_rate
                name: Resting HR
                color: "#fbc02d"
              - entity: sensor.pixel_10_pro_respiratory_rate
                name: Respiratory
                color: "#42a5f5"
            show:
              fill: fade
              points: false
              legend: true
          - type: custom:mini-graph-card
            title: Activity
            hours_to_show: 72
            points_per_hour: 4
            hour24: true
            line_width: 2
            animate: true
            entities:
              - entity: sensor.pixel_10_pro_daily_steps
                name: Daily Steps
                color: "#42a5f5"
              - entity: sensor.pixel_10_pro_daily_distance
                name: Distance
                color: "#26c6da"
              - entity: sensor.pixel_10_pro_total_calories_burned
                name: Calories
                color: "#ff7043"
            show:
              fill: fade
              points: false
              legend: true
      - type: grid
        cards:
          - type: history-graph
            title: Sleep
            hours_to_show: 168
            entities:
              - entity: sensor.pixel_10_pro_sleep_state
                name: Sleep State
              - entity: sensor.pixel_10_pro_sleep_duration
                name: Sleep Duration
