background: var(--primary-background-color)
title: Home
views:
  - badges: []
    cards:
      - type: conditional
        conditions:
          - entity: binary_sensor.azure_pipeline_running
            state: "on"
        card:
          type: markdown
          title: 🔄 Azure Pipeline Running
          content: >-
            {% for p in state_attr('binary_sensor.azure_pipeline_running', 'running') %}
            {% if not loop.first %}

            {% endif %}
            **{{ p.name }}** — running since {{ as_timestamp(p.started) | timestamp_custom('%H:%M', true) }} · [build {{ p.build }}]({{ p.url }})
            {% endfor %}
          card_mod:
            style: |
              ha-card {
                background: rgba(30, 136, 229, 0.12);
                border: 1px solid var(--info-color, #1e88e5);
              }
              ha-card .card-header {
                color: var(--info-color, #1e88e5);
              }
      - type: conditional
        conditions:
          - entity: binary_sensor.azure_pipeline_failure
            state: "on"
        card:
          type: markdown
          title: ⚠️ Azure Pipeline Failure
          content: >-
            {% for p in state_attr('binary_sensor.azure_pipeline_failure', 'failed') %}
            {% if not loop.first %}

            {% endif %}
            **{{ p.name }}** — {{ p.result }} · [build {{ p.build }}]({{ p.url }})
            {% endfor %}
          card_mod:
            style: |
              ha-card {
                background: rgba(229, 57, 53, 0.15);
                border: 1px solid var(--error-color, #e53935);
              }
              ha-card .card-header {
                color: var(--error-color, #e53935);
              }
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.active_alerts
            above: 0
        card:
          type: markdown
          content: >-
            {%- set n = states('sensor.active_alerts') | int(0) -%}
            {%- set c = states('sensor.active_alerts_critical') | int(0) -%}
            {%- set header = "## " ~ ('🔴' if c > 0 else '🟠') ~ " " ~ n ~ " active alert" ~ ('s' if n != 1 else '') ~ (" · " ~ c ~ " critical" if c > 0 else "") -%}
            {{ [header, "", "[Open Alerts →](/dashboard-overview/alerts)"] | join('\n') }}
          card_mod:
            style: |
              {% set c = states('sensor.active_alerts_critical') | int(0) %}
              {% set accent = 'var(--error-color, #e53935)' if c > 0 else 'var(--warning-color, #ff9800)' %}
              ha-card {
                background: {{ 'rgba(229, 57, 53, 0.12)' if c > 0 else 'rgba(255, 152, 0, 0.12)' }};
                border: 1px solid {{ accent }};
                border-left: 4px solid {{ accent }};
                border-radius: 10px;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
              }
              ha-markdown a {
                display: inline-block;
                margin-top: 4px;
                padding: 4px 12px;
                border-radius: 6px;
                background: {{ accent }};
                color: white !important;
                font-weight: 600;
                text-decoration: none !important;
              }
      - type: picture-elements
        image: /local/ClockBackgroundBlack2.jpg
        card_mod:
          style: |
            ha-card {
              background: var(--card-background-color) !important;
            }
            img.picture-elements__image {
              opacity: 0;
            }
        elements:
          - type: state-label
            entity: sensor.time
            style:
              color: var(--primary-text-color)
              font-size: 550%
              left: 50%
              top: 30%
              transform: translate(-50%, -50%)
