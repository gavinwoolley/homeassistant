          {%- set first = (today_at() | as_timestamp) + dtm * 86400 -%}

          {%- set header = "| Date | 🔵 Recycling | 🟢 Garden | ⚫ Refuse | 🟠
          Food |\n|:---|:---:|:---:|:---:|:---:|\n" -%}

          {%- set ns = namespace(rows=header) -%}

          {%- for i in range(13) -%}

          {%- set t = first + i * secs -%}

          {%- set w = ((t - anchor) / secs) | int -%}

          {%- set r = "| " + (t | timestamp_custom("%a %d %b")) + " | " + ("✅"
          if w % 2 == 0 else "—") + " | " + ("✅" if w % 2 == 0 else "—") + " | "
          + ("✅" if w % 3 == 0 else "—") + " | ✅ |\n" -%}

          {%- set ns.rows = ns.rows + r -%}

          {%- endfor -%}

          ## Upcoming Bin Collections


          {{ ns.rows }}
