  - type: sections
    max_columns: 3
    title: Pixel Health
    path: pixel-health
    icon: mdi:heart-pulse
    sections:
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: Pixel 10 Pro
                subtitle: Daily health snapshot
              - type: custom:mushroom-chips-card
                alignment: justify
                chips:
                  - type: template
                    entity: sensor.pixel_10_pro_heart_rate
                    icon: mdi:heart-pulse
                    icon_color: red
                    content: >-
                      Heart Rate {{ states('sensor.pixel_10_pro_heart_rate') |
                      int(0) }} bpm
                    tap_action:
                      action: more-info
                  - type: template
                    entity: sensor.pixel_10_pro_resting_heart_rate
                    icon: mdi:heart
                    icon_color: pink
                    content: >-
                      Resting HR {{
                      states('sensor.pixel_10_pro_resting_heart_rate') | int(0)
                      }} bpm
                    tap_action:
                      action: more-info
                  - type: template
                    entity: sensor.pixel_10_pro_respiratory_rate
                    icon: mdi:lungs
                    icon_color: blue
                    content: >-
                      Breathing {{
                      states('sensor.pixel_10_pro_respiratory_rate') }} bpm
                    tap_action:
                      action: more-info
                  - type: template
                    entity: sensor.pixel_10_pro_sleep_state
                    icon: >-
                      {{ 'mdi:sleep' if
                      is_state('sensor.pixel_10_pro_sleep_state', 'sleeping')
                      else 'mdi:run' }}
                    icon_color: >-
                      {{ 'indigo' if is_state('sensor.pixel_10_pro_sleep_state',
                      'sleeping') else 'amber' }}
                    content: "{{ states('sensor.pixel_10_pro_sleep_state') | title }}"
                    tap_action:
                      action: more-info
                  - type: template
                    entity: sensor.pixel_10_pro_sleep_duration_formatted
                    icon: mdi:bed-clock
                    icon_color: indigo
                    content: >-
                      Sleep {{
                      states('sensor.pixel_10_pro_sleep_duration_formatted') }}
                    tap_action:
                      action: more-info
                  - type: template
                    entity: sensor.pixel_10_pro_daily_steps
                    icon: mdi:walk
                    icon_color: blue
                    content: >-
                      Steps {{ states('sensor.pixel_10_pro_daily_steps') |
                      int(0) }} today
                    tap_action:
                      action: more-info
                  - type: template
                    entity: sensor.pixel_10_pro_steps_sensor
                    icon: mdi:shoe-print
                    icon_color: teal
                    content: >-
                      Lifetime {{ states('sensor.pixel_10_pro_steps_sensor') |
                      int(0) }} steps
                    tap_action:
                      action: more-info
                  - type: template
                    entity: sensor.pixel_10_pro_daily_distance
                    icon: mdi:map-marker-distance
                    icon_color: cyan
                    content: >-
                      Distance {{ ((states('sensor.pixel_10_pro_daily_distance')
                      | float(0)) / 1000) | round(2) }} km
                    tap_action:
                      action: more-info
                  - type: template
                    entity: sensor.pixel_10_pro_total_calories_burned
                    icon: mdi:fire
                    icon_color: deep-orange
                    content: >-
                      {{ states('sensor.pixel_10_pro_total_calories_burned') |
                      round(0) | int }} kcal burned
                    tap_action:
                      action: more-info
                  - type: template
                    entity: sensor.pixel_10_pro_sleep_segment
                    icon: mdi:sleep
                    icon_color: purple
                    content: >-
                      {% set ms = states('sensor.pixel_10_pro_sleep_segment') |
                      int(0) %} {% set mins = (ms // 60000) %} Deep Sleep {{
                      (mins // 60) }}h {{ (mins % 60) }}m
                    tap_action:
                      action: more-info
                  - type: template
                    entity: sensor.oneplus_watch_battery_level
                    icon: mdi:watch
                    icon_color: green
                    content: >-
                      OnePlus Watch {{
                      states('sensor.oneplus_watch_battery_level') | int(0) }}%
                    tap_action:
                      action: more-info
      - type: grid
        cards:
          - type: custom:mini-graph-card
            title: Heart and Breathing
            hours_to_show: 72
            points_per_hour: 6
            hour24: true
            line_width: 2
            animate: true
            entities:
              - entity: sensor.pixel_10_pro_heart_rate
