  - badges: []
    path: alerts
    title: Alerts
    icon: mdi:bell-alert
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Alert Controls
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.active_alerts
                name: Firing alerts
                icon: mdi:bell-ring
              - entity: sensor.active_alerts_critical
                name: Critical
                icon: mdi:alert-octagon
              - entity: sensor.active_alerts_warning
                name: Warning
                icon: mdi:alert
              - entity: sensor.active_alerts_info
                name: Info
                icon: mdi:information
              - entity: binary_sensor.monitoring_watchdog
                name: Monitoring pipeline
                icon: mdi:heart-pulse
              - type: section
                label: Mute WhatsApp / push (rules keep evaluating)
              - entity: input_boolean.alerts_muted
                name: Mute all alerts
              - entity: input_select.alert_mute_duration
                name: Mute duration
      - type: grid
        cards:
          - type: heading
            heading: Firing now
          - type: markdown
            content: >-
              {%- set alerts = state_attr('sensor.active_alerts', 'alerts') or [] -%}
              {%- set churn = ['TargetDown', 'WindowsHostRebooted'] -%}
              {#- transient hosts: keep everything except the expected churn (host
                  unreachable / laptop reboot); real problems still show. Built as
                  a loop, not selectattr/rejectattr, because most alerts carry no
                  'tier' label and rejectattr('labels.tier', ...) raises
                  UndefinedError on those. -#}
              {%- set fns = namespace(firing=[]) -%}
              {%- for a in alerts -%}
                {%- if a.state == 'firing' and a.labels.alertname != 'Watchdog'
                       and not (a.labels.get('tier') == 'transient' and a.labels.alertname in churn) -%}
                  {%- set fns.firing = fns.firing + [a] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set firing = fns.firing -%}
              {%- if firing | count == 0 -%}
                _No alerts firing._
              {%- else -%}
                {%- set sev_emoji = {'critical': '🚨', 'warning': '⚠️', 'info': 'ℹ️'} -%}
                {%- set ns = namespace(blocks=[], matchers=[]) -%}
                {%- for a in firing -%}
                  {%- set sev = a.labels.severity | default('none') -%}
                  {%- set emoji = sev_emoji.get(sev, '❓') -%}
                  {%- set instance_meaningful = a.labels.job in ["windows", "integrations/unix"] -%}
                  {%- set head = "**" ~ emoji ~ " " ~ (sev | upper) ~ " · " ~ a.labels.alertname ~ (" · " ~ a.labels.instance if instance_meaningful and a.labels.instance is defined else "") ~ "**" -%}
                  {%- set lines = [head] -%}
                  {%- if a.annotations.summary is defined -%}
                    {%- set lines = lines + ["Summary: " ~ a.annotations.summary] -%}
                  {%- endif -%}
                  {%- if a.annotations.description is defined -%}
                    {%- set lines = lines + ["Description: " ~ a.annotations.description] -%}
                  {%- endif -%}
                  {%- set lines = lines + ["Since: " ~ (as_timestamp(a.activeAt) | timestamp_custom('%d %b %H:%M', true))] -%}
                  {%- set link_parts = [] -%}
                  {%- if a.annotations.runbook_url is defined -%}
                    {%- set link_parts = link_parts + ["[Runbook](" ~ a.annotations.runbook_url ~ ")"] -%}
                  {%- endif -%}
                  {%- set ns.matchers = [] -%}
                  {%- for k, v in a.labels.items() -%}
                    {%- set ns.matchers = ns.matchers + ["matcher=" ~ k ~ "=" ~ (v | string | urlencode)] -%}
                  {%- endfor -%}
                  {%- set silence_url = "https://home.example.com:599/grafana/alerting/silence/new?alertmanager=" ~ ("Mimir Alertmanager" | urlencode) ~ "&" ~ (ns.matchers | join("&")) -%}
                  {%- set link_parts = link_parts + ["[Silence](" ~ silence_url ~ ")"] -%}
                  {%- set lines = lines + [link_parts | join(" · ")] -%}
                  {%- set ns.blocks = ns.blocks + [lines | join("\n\n")] -%}
                {%- endfor -%}
                {{ ns.blocks | join("\n\n---\n\n") }}
              {%- endif %}


              [Grafana alerting](https://home.example.com:599/grafana/alerting/list)
              · [Silences](https://home.example.com:599/grafana/alerting/silences?alertmanager=Mimir%20Alertmanager)
