        card:
          type: custom:mushroom-template-card
          entity: sensor.p2s_22e8bj620203679_print_status
          primary: >-
            {% set st = states('sensor.p2s_22e8bj620203679_print_status') %}
            {% if st == 'pause' %}
              🖨️ Print job paused
            {% elif st == 'prepare' %}
              🖨️ Print job starting…
            {% else %}
              🖨️ Print job running
            {% endif %}
          secondary: >-
            {% set st = states('sensor.p2s_22e8bj620203679_print_status') %}
            {% set raw_name = states('sensor.p2s_22e8bj620203679_task_name') %}
            {# Bambu/Orca Studio names an unlabelled plate after its slicer
               profile ("0.2mm layer, 2 walls, 15% infill") - strip that out,
               leaving a real custom task name untouched. #}
            {% set name = raw_name
              | regex_replace('\s*[\d.]+\s*mm\s*layer,?', '', ignorecase=true)
              | regex_replace('\s*\d+\s*walls?,?', '', ignorecase=true)
              | regex_replace('\s*\d+%?\s*infill,?', '', ignorecase=true)
              | regex_replace('\s*nozzle\s*[\d.]+\s*mm,?', '', ignorecase=true)
              | regex_replace('^[,\s]+|[,\s]+$', '')
            %}
            {% if name == '' %}{% set name = 'Untitled print' %}{% endif %}
            {% if st == 'prepare' %}
              {{ name }} · heating & levelling
            {% elif st == 'pause' %}
              {{ name }} · {{ states('sensor.p2s_22e8bj620203679_print_progress') }}% ·
              layer {{ states('sensor.p2s_22e8bj620203679_current_layer') }}/{{ states('sensor.p2s_22e8bj620203679_total_layer_count') }}
            {% else %}
              {% set h = states('sensor.p2s_22e8bj620203679_remaining_time') | float(0) %}
              {{ name }} · {{ states('sensor.p2s_22e8bj620203679_print_progress') }}% ·
              layer {{ states('sensor.p2s_22e8bj620203679_current_layer') }}/{{ states('sensor.p2s_22e8bj620203679_total_layer_count') }} ·
              {{ h | int }}h {{ ((h - (h | int)) * 60) | round(0) }}m left
              (done {{ as_timestamp(states('sensor.p2s_22e8bj620203679_end_time')) | timestamp_custom('%H:%M', true) }})
            {% endif %}
          icon: mdi:printer-3d-nozzle
          icon_color: >-
